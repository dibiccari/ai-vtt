<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-VTT Tabletop</title>
<link rel="stylesheet" href="/css/tabletop.css">
</head>
<body>
<script src="/js/watch.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/voice-fx.js"></script>

<!-- ================================================================ LEFT: BATTLEMAP -->
<main class="map-panel">
  <div class="map-toolbar">
    <div class="map-controls">
    <div class="move-info" id="moveInfo"></div>
    <div class="elsewhere" id="elsewhere" hidden></div>
    <span class="move-info" id="gameClock" title="In-game time (moves with combat rounds, rests and the DM's time passing)"></span>
    <span class="spacer"></span>
    <label class="move-rule" id="mapPickBox" hidden title="Move the whole table to another place in this campaign. The AI does this by itself when the party travels.">
      <span>Map</span>
      <select id="mapPick" aria-label="Map"></select>
    </label>
    <label class="move-rule" hidden title="Fog of war: only what the party can see from where they stand is shown, and explored areas are remembered. Enemies outside the party's sight are hidden.">
      <input type="checkbox" id="fogToggle"> <span>Fog of war</span>
    </label>
    <button class="btn btn-sm" id="resetFogBtn" hidden title="Cover the whole map in fog again. Explored areas are forgotten.">↺ Reset fog</button>
    <label class="move-rule" hidden title="Show tokens the players cannot see (hidden, invisible, hiding, traps, or out of sight) as faint ghosts. Only for the person running the test.">
      <input type="checkbox" id="dmView"> <span>DM view</span>
    </label>
    <button class="btn btn-sm lab-only" hidden id="lightBtn" title="Light level of this place and its light sources">💡 Light</button>
    <button class="btn btn-sm lab-only" hidden id="sceneSave" title="Save this map with its creatures, traps and lights as a scene you can load later">💾 Save scene</button>
    <select id="scenePick" class="lab-only" hidden aria-label="Load a saved scene" title="Load a saved scene: the map and its creatures"></select>
    <button class="btn btn-sm lab-only" hidden id="sceneDelete" title="Delete the chosen scene" disabled>✕</button>
    </div>
  </div>
  <div class="map-body">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="board" aria-label="Battlemap canvas"></canvas>
    <div class="hud" hidden><span class="pill" id="hudCoords">—</span><span class="pill" id="hudZoom">100%</span></div>
    <div class="zoom-controls">
      <button id="zoomInBtn" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="fitBtn" title="Fit the whole map in the view (fit to height)" aria-label="Fit map to height">⤢</button>
      <button id="fitWidthBtn" title="Fit the map to the width of the view" aria-label="Fit map to width">↔</button>
    </div>
    <label class="places-toggle labels-toggle" id="labelsToggle" title="Show the region, place and trail names written on this map" hidden><input type="checkbox" id="showLabels" checked> Show labels</label>
    <label class="places-toggle" id="placesToggle" title="Show the named places on this map" hidden><input type="checkbox" id="showPlaces" checked> Show places</label>
  </div>
  <!-- COMBAT TRACKER: beside the map, only while there is a fight -->
  <section class="combat" id="combatPanel" aria-label="Combat tracker"></section>
  </div>
</main>

<!-- ================================================================ RIGHT: SIDEBAR -->
<aside class="sidebar">

  <div class="tabs" role="tablist" aria-label="Table, journal and party">
    <button class="tab" role="tab" id="tab-chat" data-tab="chat" aria-selected="true">🎲 Table</button>
    <button class="tab" role="tab" id="tab-journal" data-tab="journal" aria-selected="false" title="What has happened in this campaign so far">📓 Journal</button>
    <button class="tab" role="tab" id="tab-party" data-tab="party" aria-selected="false" title="The party's gear, attunement and stash">🎒 Party</button>
  </div>

  <datalist id="monsterList"></datalist>
  <!-- ---------------------------------------------------- TAB 1: CHAT -->
  <section class="tab-panel" id="panel-journal" role="tabpanel" aria-labelledby="tab-journal"><iframe id="frameJournal" title="Campaign journal" class="embed-frame"></iframe></section>
  <section class="tab-panel" id="panel-party" role="tabpanel" aria-labelledby="tab-party"><iframe id="frameParty" title="The party" class="embed-frame"></iframe></section>

  <section class="tab-panel active" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat">
    <div class="scroll" id="chatScroll">
      <div class="chat-log" id="chatLog" aria-live="polite"></div>
      <div class="typing" id="typing" aria-label="The DM is thinking"><span></span><span></span><span></span></div>
    </div>
    <div class="composer">
      <div class="speaker">Acting as <strong id="speakerName">—</strong></div>
      <div class="voice-bar">
        <button class="btn btn-mic" id="micBtn" type="button" title="Hold to talk. Release to send. (Or hold the Space bar: it works unless you are typing a message)">🎙 Hold to Talk</button>
        <button class="btn btn-sm" id="micToggleBtn" type="button" title="Start or stop continuous listening">Start Listening</button>
        <button class="btn btn-sm" id="stopSpeechBtn" type="button" title="Silence the DM">🔇 Stop voice</button>
        <div class="mic-meter" aria-hidden="true"><div id="micLevel"></div></div>
      </div>
      <div class="voice-status" id="voiceStatus">Microphone idle.</div>
      <div class="voice-opts">
        <label><input type="checkbox" id="speakToggle" checked> DM speaks replies</label>
        <label><input type="checkbox" id="autoSendToggle" checked> Auto-send what I say</label>
        <label title="Background sound and mood music, made in the browser"><input type="checkbox" id="ambienceToggle" checked> Ambient sound</label>
        <input type="range" id="ambienceVol" min="0" max="100" value="50" aria-label="Ambient volume" style="width:90px">
      </div>
      <div class="voice-status" hidden><span id="voiceEngine">Voices: checking…</span> · <a href="/settings.html" title="Choose the voice engine and the Microsoft narrator voice">change in Settings</a></div>
      <div class="begin-box" id="beginBox" hidden>
        <button class="btn btn-primary" id="beginBtn" type="button" title="The DM opens the story: the scene, the hook and the first question">Begin the adventure ▶</button>
        <span class="hint">Nothing has happened yet. The DM sets the scene and the story starts.</span>
      </div>
      <div class="dice-box">
        <label>Dice <select id="diceMode" aria-label="Who rolls the players' dice"><option value="ai">The DM rolls for me</option><option value="player">I roll my own (the DM asks and waits)</option></select></label>
        <span id="attackRollBox" hidden>
          <select id="rollDie" aria-label="Which die"><option value="20|normal">d20</option><option value="20|advantage">d20 advantage</option><option value="20|disadvantage">d20 disadvantage</option><option value="4|normal">d4</option><option value="6|normal">d6</option><option value="8|normal">d8</option><option value="10|normal">d10</option><option value="12|normal">d12</option><option value="100|normal">d100</option></select>
          <input type="number" id="attackRoll" min="1" max="100" placeholder="result" aria-label="The number you rolled">
          <button class="btn btn-sm" id="sendAttackRoll" type="button" title="Tell the DM the number you rolled on your own die">Send roll</button>
          <button class="btn btn-sm" id="autoAttackRoll" type="button" title="Roll this die for me (a real random roll) and tell the DM">Roll for me</button>
        </span>
      </div>
      <textarea id="chatInput" placeholder="Describe your action… e.g. &quot;I draw my longsword and charge the goblin by the door.&quot;"></textarea>
      <span class="hint"><span class="kbd">Enter</span> to send · <span class="kbd">Shift</span> + <span class="kbd">Enter</span> for a new line</span>
      <div class="row">
        <button class="btn btn-sm" id="pauseBtn" title="Pause: tell the DM to stop this scene and check in. Nobody has to say why.">⏸ Pause</button>
        <button class="btn btn-sm" id="recapBtn" title="The DM tells the story so far, from the campaign journal">Recap</button>
        <button class="btn btn-sm" id="clearChatBtn" title="Clear the chat log">Clear</button>
        <button class="btn btn-primary" id="sendBtn" hidden>Send Turn to AI DM</button>
      </div>
    </div>
  </section>


</aside>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="banners" id="banners" role="region" aria-label="Problems that need attention"></div>

<script src="/js/uvtt.js"></script>
<script src="/js/scenes.js"></script>
<script src="/js/wallobjects.js"></script>
<script src="/js/combat-order.js"></script>
<script src="/js/condition-rings.js"></script>
<script src="/js/token-size.js"></script>
<script src="/js/sight.js"></script>
<script src="/js/flicker.js"></script>
<script src="/js/place-pins.js"></script>
<script src="/js/map-shared.js"></script>
<script src="/js/map-labels.js"></script>
<script src="/js/fog-style.js"></script>
<script src="/js/levelup-wizard.js"></script>
<script src="/js/inventory-wizard.js"></script>
<script src="/js/effects.js"></script>
<script src="/js/ambience.js"></script>
<script src="/js/tabletop/core.js"></script>
<script src="/js/tabletop/view.js"></script>
<script src="/js/tabletop/geometry.js"></script>
<script src="/js/tabletop/movement.js"></script>
<script src="/js/tabletop/tokens.js"></script>
<script src="/js/tabletop/fog.js"></script>
<script src="/js/tabletop/map.js"></script>
<script src="/js/tabletop/render.js"></script>
<script src="/js/tabletop/input.js"></script>
<script src="/js/tabletop/hud.js"></script>
<script src="/js/tabletop/lighting.js"></script>
<script src="/js/tabletop/scenes.js"></script>
<script src="/js/tabletop/combat.js"></script>
<script src="/js/tabletop/chat.js"></script>
<script src="/js/tabletop/voice.js"></script>
<script src="/js/tabletop/bindings.js"></script>
<script src="/js/tabletop/init.js"></script>
</body>
</html>
