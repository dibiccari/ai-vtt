/* =====================================================================
   SCENES: a map with its creatures, traps and lights, saved ahead of time and loaded at the table
   ===================================================================== */
const scenesKey = () => `vtt.scenes.${state.campaignId}`;
const loadScenes = () => { const s = store.get(scenesKey(), {}); return s && typeof s === 'object' && !Array.isArray(s) ? s : {}; };

function syncScenePick() {
  const sel = $('#scenePick');
  sel.innerHTML = '';
  const first = document.createElement('option');
  first.value = '';
  first.textContent = 'Scenes…';
  sel.appendChild(first);
  for (const name of Object.keys(loadScenes()).sort()) { const o = document.createElement('option'); o.value = name; o.textContent = name; sel.appendChild(o); }
  $('#sceneDelete').disabled = true;
}

function saveScene() {
  const name = (prompt('Name this scene. It remembers the map and every creature, trap and light on it as they are now.') || '').trim().slice(0, 60);
  if (!name) return;
  const scenes = loadScenes();
  if (scenes[name] && !confirm(`Replace the scene "${name}"?`)) return;
  scenes[name] = {
    mapUrl: state.map.url, mapKind: state.mapKind,
    creatures: state.tokens.filter((t) => !t.isPC && !isSummon(t)).map(serializeToken),
    lightsOff: state.lightsOff[state.map.url || ''] || [], ambientOverride: state.ambientOverride, savedAt: Date.now()
  };
  store.set(scenesKey(), scenes);
  syncScenePick();
  $('#scenePick').value = name;
  toast(`Scene "${name}" saved`, 'ok');
}

async function applyScene(name) {
  const sc = loadScenes()[name];
  if (!sc) return;
  if (!confirm(`Load the scene "${name}"? The creatures on the board now are replaced by the ones saved in it.`)) { $('#scenePick').value = ''; return; }
  const creatures = sc.creatures.map((c) => ({ ...c, conditions: Array.isArray(c.conditions) ? c.conditions : [] }));
  state.combat = { active: false, round: 0, order: [] };
  if (sc.mapUrl && sc.mapUrl !== state.map.url) {
    const place = state.places.find((p) => p.url === sc.mapUrl);
    if (place) {
      state.mapMemory[sc.mapUrl] = { npcs: creatures, party: {} };
      await travelTo({ mapUrl: place.url, mapName: place.name, kind: place.kind, col: place.start.col, row: place.start.row, px: place.startPx });
    } else {
      await setMap(sc.mapUrl);
      state.mapKind = sc.mapKind || 'battle';
      state.tokens = [...state.tokens.filter((t) => t.isPC), ...creatures];
    }
  } else {
    state.tokens = [...state.tokens.filter((t) => t.isPC || isSummon(t)), ...creatures];
  }
  state.lightsOff[state.map.url || ''] = Array.isArray(sc.lightsOff) ? sc.lightsOff : [];
  state.ambientOverride = ['bright', 'dim', 'dark'].includes(sc.ambientOverride) ? sc.ambientOverride : '';
  state.activeIndex = 0;
  revealFog();
  commitBoard();
  toast(`Scene "${name}" loaded`, 'ok');
}

function deleteScene(name) {
  if (!name || !confirm(`Delete the scene "${name}"?`)) return;
  const scenes = loadScenes();
  delete scenes[name];
  store.set(scenesKey(), scenes);
  syncScenePick();
}

/* =====================================================================
   COMBAT TRACKER: initiative, rounds, hit points, death saves, action economy
   ===================================================================== */
const hpOf = (t) => { const c = characterFor(t); return c ? c.hp : (Number.isFinite(t.hp) ? t.hp : null); };
const maxHpOf = (t) => { const c = characterFor(t); return c ? c.maxHp : (Number.isFinite(t.maxHp) && t.maxHp > 0 ? t.maxHp : null); };
const acOf = (t) => { const c = characterFor(t); return c ? c.ac : (Number.isFinite(t.ac) && t.ac > 0 ? t.ac : null); };
const dexModOf = (t) => { const c = characterFor(t); return c ? Math.floor(((c.abilities && c.abilities.dex) || 10) / 2) - 5 : (Number.isFinite(t.dexMod) ? t.dexMod : 0); };
const combatTokens = () => state.combat.order.map((id) => state.tokens.find((t) => t.id === id)).filter(Boolean);
const d20 = () => 1 + Math.floor(Math.random() * 20);

// Hit points go up or down here. A creature at 0 is defeated; a player character at 0 falls unconscious and starts making death saves.
function changeHp(t, delta) {
  const max = maxHpOf(t);
  if (max === null || !Number.isFinite(delta)) return null;
  const before = hpOf(t);
  const after = clamp(before + Math.round(delta), 0, max);
  const c = characterFor(t);
  if (c) {
    c.hp = after;
    jsonPost('/api/characters', c).catch((err) => toast(`Could not save ${c.name}'s HP: ${err.message}`, 'error'));
  } else t.hp = after;
  if (after === 0 && before > 0) {
    if (t.isPC) { setCondition(t, 'unconscious', 0); t.deathSaves = { success: 0, fail: 0 }; t.stable = false; addChat('system', `↳ ${t.name} falls unconscious and is dying`); }
    else { t.dead = true; if (seenByParty(t)) addChat('system', `↳ ${t.name} is defeated`); }
  } else if (after > 0 && before === 0) {
    if (t.isPC) { clearCondition(t, 'unconscious'); t.deathSaves = null; t.stable = false; }
    else t.dead = false;
  }
  return { before, after };
}

function sortCombat() {
  const cur = activeToken();
  const list = combatTokens();
  list.sort((a, b) => (Number.isFinite(b.initiative) ? b.initiative : -99) - (Number.isFinite(a.initiative) ? a.initiative : -99) || dexModOf(b) - dexModOf(a) || a.name.localeCompare(b.name));
  state.combat.order = list.map((t) => t.id);
  if (cur) state.activeIndex = Math.max(0, state.tokens.indexOf(cur));
}

function beginTurn(t) {
  t.movementRemaining = effectiveSpeed(t);
  for (const s of summonsOf(t)) s.movementRemaining = s.speed;
  t.spent = { a: false, b: false, r: false };
  if (seenByParty(t)) toast(`${t.name}'s turn${t.isPC && hpOf(t) === 0 && !t.stable ? ': death saving throw' : ''}`, 'ok');
}

function startCombat() {
  if (state.combat.active) return;
  const members = state.tokens.filter((t) => t.kind !== 'trap' && !t.dead && !isSummon(t));
  if (!members.length) { toast('Put some tokens on the map first'); return; }
  state.combat = { active: true, round: 1, order: members.map((t) => t.id) };
  for (const t of members) {
    t.initiative = t.isPC ? null : d20() + dexModOf(t);     // the players give their own; creatures are rolled here
    t.spent = { a: false, b: false, r: false };
  }
  sortCombat();
  const first = combatTokens()[0];
  if (first) state.activeIndex = state.tokens.indexOf(first);
  addChat('system', '⚔ Combat begins. Players: enter your initiative, or press "Roll for players".');
  syncAmbience();
  commitBoard();
  renderCombat();
}

function rollForPlayers() {
  for (const t of combatTokens()) if (t.isPC && !Number.isFinite(t.initiative)) t.initiative = d20() + dexModOf(t);
  sortCombat();
  commitBoard();
  renderCombat();
}

function joinCombat(t) {
  if (!state.combat.active || t.kind === 'trap' || isSummon(t) || state.combat.order.includes(t.id)) return;
  state.combat.order.push(t.id);
  t.initiative = t.isPC ? null : d20() + dexModOf(t);
  t.spent = { a: false, b: false, r: false };
  sortCombat();
}

function nextCombatTurn() {
  const order = combatTokens();
  if (!order.length) return;
  const waiting = order.filter((t) => t.isPC && !Number.isFinite(t.initiative)).map((t) => t.name);
  if (waiting.length) { toast(`Waiting for initiative: ${waiting.join(', ')}`); return; }
  const idx = order.indexOf(activeToken());
  let wrapped = false, chosen = null;
  for (let n = 1; n <= order.length; n++) {
    if (idx + n >= order.length) wrapped = true;
    const t = order[(idx + n + order.length) % order.length];
    // Defeated creatures are skipped; creatures the party cannot see are skipped too (the AI plays their turns in the narration).
    if (t.dead || !seenByParty(t)) continue;
    chosen = t;
    break;
  }
  if (!chosen) return;
  if (wrapped) {
    state.combat.round += 1;
    addChat('system', `⏱ Round ${state.combat.round}`);
    if (tickConditions()) revealFog();
  }
  state.activeIndex = state.tokens.indexOf(chosen);
  beginTurn(chosen);
  commitBoard();
  renderCombat();
}

function endCombat() {
  if (!state.combat.active) return;
  state.combat = { active: false, round: 0, order: [] };
  for (const t of state.tokens) { t.initiative = null; t.spent = null; }
  addChat('system', '⚔ Combat ends');
  syncAmbience();
  commitBoard();
  renderCombat();
}

// Creatures of the SRD, added from the tracker (names for the box come from the compendium).
let monsterNames = null;
async function loadMonsterNames() {
  if (monsterNames) return monsterNames;
  try { monsterNames = (await api('/api/compendium/monsters')).entries; } catch { monsterNames = []; }
  const list = $('#monsterList');
  list.innerHTML = '';
  for (const m of monsterNames) { const o = document.createElement('option'); o.value = m.name; list.appendChild(o); }
  return monsterNames;
}

async function addMonsters(name, count, hidden) {
  const names = await loadMonsterNames();
  const found = names.find((m) => m.name.toLowerCase() === String(name).trim().toLowerCase());
  if (!found) { toast(`"${name}" is not in the SRD bestiary`, 'error'); return; }
  const { entry } = await api('/api/compendium/monsters/' + encodeURIComponent(found.index));
  const mid = screenToWorld(wrap.clientWidth / 2, wrap.clientHeight / 2);
  const cell = worldToCell(mid.x, mid.y);
  const walk = parseInt(entry.speed && entry.speed.walk, 10);
  const n = clamp(Math.round(count) || 1, 1, 20);
  const sameBefore = state.tokens.filter((t) => t.monster === entry.index).length;
  for (let i = 0; i < n; i++) {
    const spot = freeSquareNear(clamp(cell.col, 0, cols() - 1), clamp(cell.row, 0, rows() - 1));
    const number = sameBefore + i + 1;
    const t = makeToken({
      id: `mon-${entry.index}-${Date.now().toString(36)}${i}`, name: n + sameBefore > 1 ? `${entry.name} ${number}` : entry.name,
      color: '#a04545', isPC: false, hidden, kind: 'creature', speed: Number.isFinite(walk) ? walk : 30, image: entry.image || '', ...spot
    });
    Object.assign(t, { monster: entry.index, hp: entry.hit_points, maxHp: entry.hit_points, ac: entry.armor_class[0].value, dexMod: Math.floor((entry.dexterity - 10) / 2) });
    state.tokens.push(t);
    joinCombat(t);
  }
  revealFog();
  commitBoard();
  renderCombat();
}

function pips(count, cls, onClick) {
  const row = document.createElement('span');
  for (let i = 0; i < 3; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `cb-pip ${cls}${i < count ? ' on' : ''}`;
    b.textContent = cls === 'fail' ? '✗' : '✓';
    b.title = cls === 'fail' ? 'Failed death save' : 'Successful death save';
    b.addEventListener('click', () => onClick(i < count ? i : i + 1));
    row.appendChild(b);
  }
  return row;
}

function combatRow(t) {
  const row = document.createElement('div');
  row.className = `cb-row${t === activeToken() && state.combat.active ? ' current' : ''}${t.dead ? ' dead' : ''}${t.isPC ? '' : ' npc'}`;
  const line1 = document.createElement('div');
  line1.className = 'cb-line';
  const init = document.createElement('input');
  init.type = 'number';
  init.className = 'cb-init';
  init.placeholder = '?';
  init.title = 'Initiative';
  init.value = Number.isFinite(t.initiative) ? t.initiative : '';
  init.addEventListener('change', () => { t.initiative = init.value === '' ? null : Number(init.value); sortCombat(); commitBoard(); renderCombat(); });
  const name = document.createElement('button');
  name.className = 'cb-name';
  name.textContent = t.name + (t.dead ? ' ✖' : '');
  name.title = state.gmOverride ? `Make ${t.name} active` : `Center on ${t.name}`;
  name.addEventListener('click', () => { centerOnToken(t); });
  line1.append(init, name);
  if (t.monster) {
    const link = document.createElement('a');
    link.href = `/bestiary.html#${t.monster}`;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = '📖';
    link.title = 'Open the stat block';
    line1.appendChild(link);
  }
  const ac = acOf(t);
  if (ac !== null) { const s = document.createElement('span'); s.className = 'cb-ac'; s.textContent = `AC ${ac}`; line1.appendChild(s); }
  row.appendChild(line1);

  const max = maxHpOf(t);
  if (max !== null) {
    const hp = hpOf(t);
    const line2 = document.createElement('div');
    line2.className = 'cb-line';
    const bar = document.createElement('div');
    bar.className = 'cb-hpbar';
    const fill = document.createElement('i');
    const pct = clamp(hp / max, 0, 1);
    fill.style.width = `${pct * 100}%`;
    fill.style.background = pct > 0.5 ? '#3fd27f' : pct > 0.25 ? '#f0c048' : '#ff6b6b';
    bar.appendChild(fill);
    const text = document.createElement('span');
    text.className = 'cb-hptext';
    text.textContent = `${hp}/${max}`;
    const amount = document.createElement('input');
    amount.type = 'number';
    amount.min = '1';
    amount.className = 'cb-num';
    amount.placeholder = 'HP';
    amount.setAttribute('aria-label', `Hit points to change for ${t.name}`);
    const apply = (sign) => { const v = Number(amount.value); if (!(v > 0)) { amount.focus(); return; } changeHp(t, sign * v); commitBoard(); renderCombat(); };
    const dmg = document.createElement('button'); dmg.className = 'btn btn-sm'; dmg.textContent = '−'; dmg.title = 'Damage'; dmg.addEventListener('click', () => apply(-1));
    const heal = document.createElement('button'); heal.className = 'btn btn-sm'; heal.textContent = '+'; heal.title = 'Heal'; heal.addEventListener('click', () => apply(1));
    amount.addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(-1); });
    line2.append(bar, text, amount, dmg, heal);
    row.appendChild(line2);
    if (t.isPC && hp === 0 && !t.stable && t.deathSaves) {
      const line3 = document.createElement('div');
      line3.className = 'cb-line';
      const lab = document.createElement('span'); lab.className = 'cb-ac'; lab.textContent = 'Death saves';
      const set = (key, v) => {
        t.deathSaves[key] = clamp(v, 0, 3);
        if (t.deathSaves.success >= 3) { t.stable = true; addChat('system', `↳ ${t.name} is stable`); }
        if (t.deathSaves.fail >= 3) { t.dead = true; addChat('system', `↳ ${t.name} has died`); }
        commitBoard(); renderCombat();
      };
      line3.append(lab, pips(t.deathSaves.success, 'ok', (v) => set('success', v)), pips(t.deathSaves.fail, 'fail', (v) => set('fail', v)));
      row.appendChild(line3);
    }
  }

  if (state.combat.active) {
    const line4 = document.createElement('div');
    line4.className = 'cb-line';
    const spent = t.spent || { a: false, b: false, r: false };
    for (const [key, label, tip] of [['a', 'Action', 'Action used this turn'], ['b', 'Bonus', 'Bonus action used this turn'], ['r', 'Reaction', 'Reaction used since the start of its turn']]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `cb-use${spent[key] ? ' spent' : ''}`;
      b.textContent = label;
      b.title = tip;
      b.addEventListener('click', () => { t.spent = { ...spent, [key]: !spent[key] }; commitBoard(); renderCombat(); });
      line4.appendChild(b);
    }
    for (const c of tokenConditions(t)) {
      const chip = document.createElement('span');
      chip.className = 'cond-dot';
      chip.style.background = conditionBadge(c.name)[1];
      chip.title = conditionLabel(c) + (conditionHelp(c.name) ? ': ' + conditionHelp(c.name) : '');
      chip.textContent = conditionBadge(c.name)[0];
      line4.appendChild(chip);
    }
    row.appendChild(line4);
  }
  return row;
}

function renderCombat() {
  const box = $('#combatPanel');
  if (!box) return;
  box.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'cb-head';
  const title = document.createElement('span');
  title.className = 'cb-title';
  const cur = activeToken();
  title.innerHTML = state.combat.active ? `⚔ Combat <small>round ${state.combat.round}${cur ? ' · ' + esc(cur.name) + "'s turn" : ''}</small>` : '⚔ Combat <small>not started</small>';
  head.appendChild(title);
  const btn = (label, tip, fn, cls) => { const b = document.createElement('button'); b.className = `btn btn-sm${cls ? ' ' + cls : ''}`; b.textContent = label; b.title = tip; b.addEventListener('click', fn); head.appendChild(b); return b; };
  if (state.combat.active) {
    btn('Next turn ⏭', 'End this turn and move to the next in initiative order', nextCombatTurn, 'btn-gold');
    btn('Roll for players', 'Roll initiative for every player character that has none yet', rollForPlayers);
    btn('End combat', 'Finish the fight', () => { if (confirm('End combat?')) endCombat(); });
  } else {
    btn('Short rest', 'The party takes a short rest', () => takeRest('short'));
    btn('Long rest', 'The party camps for the night: hit points and spell slots are restored', () => takeRest('long'));
    btn('Start combat', 'Roll initiative for the creatures on the board and begin tracking rounds', startCombat, 'btn-primary');
  }
  const conj = document.createElement('div');
  conj.className = 'cb-add';
  const conjSel = document.createElement('select');
  conjSel.setAttribute('aria-label', 'Conjure');
  for (const [v, text] of [['', 'Conjure (for the active character)…']].concat(Object.keys(SUMMONS).map((k) => [k, SUMMONS[k].name]))) { const o = document.createElement('option'); o.value = v; o.textContent = text; conjSel.appendChild(o); }
  conjSel.addEventListener('change', () => { if (conjSel.value && activeToken()) conjure(conjSel.value, isSummon(activeToken()) ? state.tokens.find((o) => o.id === activeToken().summon.ownerId) : activeToken()); conjSel.value = ''; });
  conj.appendChild(conjSel);
  const add = document.createElement('div');
  add.className = 'cb-add';
  const name = document.createElement('input');
  name.type = 'text';
  name.placeholder = 'Add a creature (SRD)…';
  name.setAttribute('list', 'monsterList');
  name.setAttribute('aria-label', 'Creature to add');
  name.addEventListener('focus', loadMonsterNames);
  const count = document.createElement('input');
  count.type = 'number';
  count.min = '1';
  count.max = '20';
  count.value = '1';
  count.className = 'cb-num';
  count.title = 'How many';
  const hid = document.createElement('label');
  hid.className = 'cb-ac';
  const hidBox = document.createElement('input');
  hidBox.type = 'checkbox';
  hid.append(hidBox, document.createTextNode(' hidden'));
  const go = document.createElement('button');
  go.className = 'btn btn-sm';
  go.textContent = 'Add';
  const submit = () => { if (name.value.trim()) addMonsters(name.value, Number(count.value), hidBox.checked).then(() => { name.value = ''; }).catch((err) => toast(err.message, 'error')); };
  go.addEventListener('click', submit);
  name.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  add.append(name, count, hid, go);
  box.append(head, add, conj);
  if (state.combat.active) {
    const rows = combatTokens().filter(canSee);
    for (const t of rows) box.appendChild(combatRow(t));
    const waiting = combatTokens().filter((t) => t.isPC && !Number.isFinite(t.initiative));
    if (waiting.length) { const n = document.createElement('div'); n.className = 'cb-note'; n.textContent = `Waiting for initiative: ${waiting.map((t) => t.name).join(', ')}`; box.appendChild(n); }
  } else {
    // Out of combat the tracker still shows hit points of anything that has them, so damage can be tracked before a fight too.
    for (const t of state.tokens.filter((x) => canSee(x) && maxHpOf(x) !== null && (x.isPC ? false : true))) box.appendChild(combatRow(t));
  }
}

// A rest ends lasting effects on the player tokens; a long rest also clears exhaustion and the dying state. (Hit points and spell
// slots are restored on the server; the characters are reloaded after.)
function restTokens(kind) {
  for (const t of state.tokens.filter((x) => x.isPC)) {
    t.conditions = tokenConditions(t).filter((c) => !(c.rounds > 0) && c.name !== 'concentrating' && !(kind === 'long' && (c.name === 'exhaustion' || c.name === 'unconscious')));
    if (kind === 'long') { t.deathSaves = null; t.stable = false; t.dead = false; }
  }
  revealFog();
  addChat('system', kind === 'long' ? '☾ The party takes a long rest: hit points and spell slots are restored' : '☾ The party takes a short rest');
  commitBoard();
}

async function takeRest(kind) {
  if (state.busy) return;
  try {
    await jsonPost('/api/party/rest', { kind });
    await loadCharacters();
    restTokens(kind);
    // Let the Dungeon Master narrate it (and handle anything that happens in the night).
    await sendTurn(`The party takes a ${kind} rest here. (The table has already restored hit points and spell slots.)`, { typed: true });
  } catch (err) { toast(err.message, 'error'); }
}

// Attack d20 for tables where the player rolls their own dice.
function syncDiceUi() {
  const mode = store.get('vtt.diceMode', 'ai') === 'player' ? 'player' : 'ai';
  $('#diceMode').value = mode;
  $('#attackRollBox').hidden = mode !== 'player';
}
function sendAttackRoll(value) {
  const n = Math.round(Number(value));
  if (!(n >= 1 && n <= 20)) { toast('Enter the number on the d20 (1 to 20)'); $('#attackRoll').focus(); return; }
  $('#attackRoll').value = '';
  sendTurn(`Attack roll: I rolled ${n} on the d20.`, { typed: true });
}
const combatForAi = () => ({
  active: state.combat.active, round: state.combat.round, currentTokenId: activeToken() ? activeToken().id : '',
  order: combatTokens().map((t) => ({ tokenId: t.id, initiative: Number.isFinite(t.initiative) ? t.initiative : null }))
});

function scrollChat() {
  const s = $('#chatScroll');
  requestAnimationFrame(() => { s.scrollTop = s.scrollHeight; });
}

function renderChatMessage(m) {
  const el = document.createElement('div');
  el.className = `msg msg-${m.role}`;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = m.role === 'assistant' ? 'Dungeon Master' : m.role === 'user' ? 'Player' : 'System';
  const body = document.createElement('div');
  body.className = 'body';
  if (m.role === 'assistant' && Array.isArray(m.lines) && m.lines.length) {
    m.lines.forEach((line, i) => {
      const span = document.createElement('span');
      span.className = 'voice-line';
      span.dataset.line = String(i);
      if (line.speaker && line.speaker !== 'Narrator') {
        const tag = document.createElement('span');
        tag.className = 'speaker-tag';
        tag.textContent = `${line.speaker}: `;
        span.appendChild(tag);
      }
      span.appendChild(document.createTextNode(line.text));
      body.appendChild(span);
    });
  } else {
    body.textContent = m.content;
  }
  el.append(who, body);
  return el;
}

function renderChat() {
  const log = $('#chatLog');
  log.innerHTML = '';
  for (const m of state.chat) log.appendChild(renderChatMessage(m));
  scrollChat();
}

function addChat(role, content, lines) {
  const m = { role, content: String(content), ts: Date.now() };
  if (Array.isArray(lines) && lines.length) m.lines = lines;
  state.chat.push(m);
  if (state.chat.length > 200) state.chat = state.chat.slice(-200);
  store.set(chatKey(), state.chat);
  const el = renderChatMessage(m);
  $('#chatLog').appendChild(el);
  scrollChat();
  return el;
}

function setBusy(busy) {
  state.busy = busy;
  $('#sendBtn').disabled = busy;
  $('#sendBtn').textContent = busy ? 'The DM is thinking…' : 'Send Turn to AI DM';
  $('#typing').classList.toggle('show', busy);
  if (busy) scrollChat();
}

async function sendTurn(spokenText, opts) {
  if (state.busy) return;
  const input = $('#chatInput');
  const isVoice = typeof spokenText === 'string' && !(opts && opts.typed);
  const text = (typeof spokenText === 'string' ? spokenText : input.value).trim();
  if (!text) { toast('Describe your action first'); input.focus(); return; }
  voice.cancelSpeech();
  const active = activeToken();
  const content = active ? `[${active.name}] ${text}` : text;
  const history = state.chat
    .filter((m) => m.role === 'user' || m.role === 'assistant')
    .slice(-20)
    .map(({ role, content: c }) => ({ role, content: c }));

  addChat('user', content);
  input.value = '';
  setBusy(true);
  try {
    const data = await jsonPost('/api/chat', {
      message: content,
      history,
      activeTokenId: active ? active.id : null,
      tokens: state.tokens.map((t) => ({ ...serializeToken(t), visibleToParty: seenByParty(t) })),
      characters: state.characters.map(({ sheetLog, ...rest }) => rest),
      walls: state.walls.map(({ x1, y1, x2, y2, type, open }) => ({ x1, y1, x2, y2, type, open: !!open })),
      gridSize: GRID,
      mapUrl: state.map.url || '',
      movementRule: state.moveRule,
      mapName: state.map.url ? prettyMapName(state.map.url) : 'blank grid',
      inputMode: isVoice ? 'voice' : 'text',
      combat: combatForAi(),
      corrections: state.pendingCorrections.splice(0, 8),
      lighting: lightingForAi(),
      diceMode: store.get('vtt.diceMode', 'ai') === 'player' ? 'player' : 'ai'
    });
    const lines = Array.isArray(data.voiceLines) ? data.voiceLines : [];
    const msgEl = addChat('assistant', data.narrative || '(The Dungeon Master remains silent.)', lines);
    await applyMapUpdates(Array.isArray(data.mapUpdates) ? data.mapUpdates : []);
    applyCharacterUpdates(data.characterUpdates, data.characterProblems);
    if (Array.isArray(data.partyNotes) && data.partyNotes.length) addChat('system', '🎒 ' + data.partyNotes.join('; '));
    if (Array.isArray(data.partyChanged) && data.partyChanged.length) await loadCharacters();
    if (Array.isArray(data.journalAdded) && data.journalAdded.length) addChat('system', '📓 Journal: ' + data.journalAdded.map((e) => e.title).join(', '));
    if (lines.length) voice.speak(lines, msgEl);
  } catch (err) {
    addChat('system', `Could not reach the AI DM: ${err.message}`);
    toast(err.message, 'error');
  } finally {
    setBusy(false);
  }
}

/* =====================================================================
   VOICE MODE: microphone (getUserMedia) + speech-to-text + spoken DM replies
   ===================================================================== */
const VOICE_PROFILES = {
  narrator:  { pitch: 1.0,  rate: 1.0,  gender: null },
  gruff:     { pitch: 0.8,  rate: 0.95, gender: 'male' },
  sly:       { pitch: 1.1,  rate: 1.08, gender: 'male' },
  noble:     { pitch: 1.0,  rate: 0.95, gender: 'male' },
  elderly:   { pitch: 0.75, rate: 0.8,  gender: 'male' },
  child:     { pitch: 1.85, rate: 1.12, gender: 'female' },
  monstrous: { pitch: 0.55, rate: 0.82, gender: 'male' },
  ethereal:  { pitch: 1.2,  rate: 0.88, gender: 'female' },
  feminine:  { pitch: 1.05, rate: 1.0,  gender: 'female' },
  masculine: { pitch: 0.9,  rate: 1.0,  gender: 'male' },
  beast:     { pitch: 0.7,  rate: 0.9,  gender: 'male' },
  smallbeast: { pitch: 2.0, rate: 1.3,  gender: 'female' },
  largebeast: { pitch: 0.62, rate: 0.82, gender: 'male' },
  undead:    { pitch: 0.8,  rate: 0.8,  gender: null }
};

const voice = (() => {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis || null;
  const mic = { stream: null, audioCtx: null, analyser: null, raf: 0, data: null };
  let recognition = null;
  let listening = false;     // recognition currently running
  let continuous = false;    // Start Listening mode
  let holding = false;       // push-to-talk held
  let transcript = '';
  let interim = '';
  let speakGen = 0;
  let speaking = false;      // DM audio is playing
  let ignoreUntil = 0;       // quiet period after the DM stops, so echo and tails are dropped
  const TAIL_GRACE_MS = 1200;
  const assigned = new Map(); // speaker name -> SpeechSynthesisVoice (consistent per NPC)

  const status = (text, live = false) => {
    const el = $('#voiceStatus');
    el.textContent = text;
    el.classList.toggle('live', live);
  };

  async function ensureMic() {
    if (mic.stream && mic.stream.active) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      status('This browser has no microphone API (needs https or localhost).');
      toast('Microphone API unavailable in this browser', 'error');
      return false;
    }
    try {
      mic.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (err) {
      const denied = err.name === 'NotAllowedError' || err.name === 'SecurityError';
      const missing = err.name === 'NotFoundError' || err.name === 'OverconstrainedError';
      status(denied ? 'Microphone permission denied. Allow it in the browser site settings.'
        : missing ? 'No microphone found.' : `Microphone error: ${err.message}`);
      toast(denied ? 'Microphone permission denied' : missing ? 'No microphone found' : `Microphone error: ${err.message}`, 'error', 4000);
      return false;
    }
    if (speaking) mic.stream.getAudioTracks().forEach((t) => { t.enabled = false; });
    try {
      mic.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = mic.audioCtx.createMediaStreamSource(mic.stream);
      mic.analyser = mic.audioCtx.createAnalyser();
      mic.analyser.fftSize = 512;
      mic.data = new Uint8Array(mic.analyser.fftSize);
      source.connect(mic.analyser);
      meterLoop();
    } catch (err) {
      console.warn('Level meter unavailable:', err.message);
    }
    return true;
  }

  function meterLoop() {
    if (!mic.analyser) return;
    mic.analyser.getByteTimeDomainData(mic.data);
    let peak = 0;
    for (let i = 0; i < mic.data.length; i++) peak = Math.max(peak, Math.abs(mic.data[i] - 128));
    $('#micLevel').style.width = `${Math.min(100, Math.round((peak / 128) * 160))}%`;
    mic.raf = requestAnimationFrame(meterLoop);
  }

  // Hard-mute the captured stream while the DM talks (the recognizer is also stopped in speak()).
  function setMicMuted(muted) {
    if (mic.stream) mic.stream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
    if (muted) status('Mic muted while the DM speaks…');
    else if (continuous) status('Listening… speak your action.', true);
    else if (!holding) status(SpeechRec ? 'Microphone idle.' : status_idle_no_stt());
  }
  const status_idle_no_stt = () => 'Microphone idle. Speech-to-text is unsupported here; use Chrome or Edge, or type.';

  function releaseMic() {
    cancelAnimationFrame(mic.raf);
    if (mic.stream) mic.stream.getTracks().forEach((t) => t.stop());
    if (mic.audioCtx) mic.audioCtx.close().catch(() => {});
    mic.stream = null; mic.audioCtx = null; mic.analyser = null;
    $('#micLevel').style.width = '0%';
  }

  function reflectUi() {
    const live = holding || continuous;
    $('#micBtn').classList.toggle('live', holding);
    $('#micBtn').textContent = holding ? '🎙 Listening… release to send' : '🎙 Hold to Talk';
    $('#micToggleBtn').textContent = continuous ? 'Stop Listening' : 'Start Listening';
    $('#micToggleBtn').classList.toggle('btn-danger', continuous);
    if (!live) status(SpeechRec ? 'Microphone idle.' : 'Microphone idle. Speech-to-text is unsupported here; use Chrome or Edge, or type.');
  }

  function buildRecognition() {
    const rec = new SpeechRec();
    rec.lang = navigator.language || 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      // Ignore anything heard while the DM is talking (or just finished): it is the DM, not the player.
      if (speaking || Date.now() < ignoreUntil) { transcript = ''; interim = ''; return; }
      interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const piece = e.results[i][0].transcript;
        if (e.results[i].isFinal) transcript += `${piece} `;
        else interim += piece;
      }
      $('#chatInput').value = `${transcript}${interim}`.trim();
      status(`Heard: “${$('#chatInput').value}”`, true);
      if (continuous && !holding && transcript.trim() && !interim) flush();
    };
    rec.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
      const msg = e.error === 'not-allowed' ? 'Speech recognition permission denied.'
        : e.error === 'network' ? 'Speech recognition needs a network connection in this browser.'
        : `Speech recognition error: ${e.error}`;
      status(msg);
      toast(msg, 'error', 4000);
      continuous = false; holding = false;
      reflectUi();
    };
    rec.onend = () => {
      listening = false;
      if ((holding || continuous) && !speaking) { startRecognition(); }
    };
    return rec;
  }

  function startRecognition() {
    if (!SpeechRec || listening) return;
    if (!recognition) recognition = buildRecognition();
    try { recognition.start(); listening = true; } catch (err) { console.warn('recognition.start:', err.message); }
  }

  function stopRecognition() {
    if (recognition && listening) { try { recognition.stop(); } catch { /* already stopped */ } }
  }

  // Send whatever has been transcribed so far.
  function flush() {
    const text = `${transcript}${interim}`.trim();
    transcript = ''; interim = '';
    if (!text) return;
    if ($('#autoSendToggle').checked) { $('#chatInput').value = ''; sendTurn(text); }
    else $('#chatInput').value = text;
  }

  async function beginHold() {
    if (holding || state.busy) return;
    if (!(await ensureMic())) return;
    cancelSpeech();
    holding = true;
    transcript = ''; interim = '';
    reflectUi();
    if (SpeechRec) { status('Listening…', true); startRecognition(); }
    else status('Mic is live, but this browser cannot transcribe speech. Type your action instead.');
  }

  function endHold() {
    if (!holding) return;
    holding = false;
    reflectUi();
    // Give the recognizer a moment to deliver its final result before sending.
    setTimeout(() => {
      if (!continuous) stopRecognition();
      flush();
    }, 450);
  }

  async function toggleContinuous() {
    if (continuous) {
      continuous = false;
      stopRecognition();
      if (!holding) releaseMic();
      reflectUi();
      return;
    }
    if (!(await ensureMic())) return;
    if (!SpeechRec) { status('Mic is live, but this browser cannot transcribe speech. Use Chrome or Edge, or type.'); toast('Speech-to-text is not supported in this browser', 'error', 4000); return; }
    continuous = true;
    transcript = ''; interim = '';
    reflectUi();
    status('Listening… speak your action.', true);
    startRecognition();
  }

  /* ---------- text-to-speech ---------- */
  function pickVoice(speaker, profileName) {
    const key = speaker.toLowerCase();
    if (assigned.has(key)) return assigned.get(key);
    const all = synth.getVoices().filter((v) => /^en/i.test(v.lang));
    const pool = all.length ? all : synth.getVoices();
    if (!pool.length) return null;
    const gender = (VOICE_PROFILES[profileName] || VOICE_PROFILES.narrator).gender;
    const maleRe = /(david|mark|james|george|daniel|alex|male|guy|ryan|thomas|fred|aaron|brian|davis|jason|tony|christopher|eric|roger|andrew|steffan|liam|oliver|arthur)/i;
    const femaleRe = /(zira|susan|hazel|samantha|female|aria|jenny|karen|fiona|victoria|moira|tessa|libby|sonia|michelle|ana|emma|ava|jane|nancy|sara|amber|ashley)/i;
    // Neural/online voices sound far more human than the legacy desktop ones.
    const quality = (v) => (/natural|neural|online/i.test(v.name) ? 100 : 0)
      + (/premium|enhanced|studio|wavenet/i.test(v.name) ? 60 : 0)
      + (/google/i.test(v.name) ? 40 : 0)
      + (v.localService ? 0 : 20)
      - (/desktop|espeak|compact/i.test(v.name) ? 50 : 0);
    const chosenNarrator = store.get('vtt.narratorVoice', '');
    if (key === 'narrator' && chosenNarrator) {
      const picked = pool.find((v) => v.name === chosenNarrator);
      if (picked) { assigned.set(key, picked); return picked; }
    }
    let candidates = pool;
    if (gender === 'male') candidates = pool.filter((v) => maleRe.test(v.name) && !femaleRe.test(v.name));
    else if (gender === 'female') candidates = pool.filter((v) => femaleRe.test(v.name));
    if (!candidates.length) candidates = pool;
    candidates = [...candidates].sort((a, b) => quality(b) - quality(a));
    // Distinct NPCs get distinct voices where possible, best quality first.
    const used = new Set(assigned.values());
    const choice = candidates.find((v) => !used.has(v)) || candidates[0];
    assigned.set(key, choice);
    return choice;
  }

  function cancelSpeech() {
    speakGen++;
    if (speaking) setMicMuted(false);
    speaking = false;
    ignoreUntil = Date.now() + 400;
    if (synth) synth.cancel();
    cloudStop();
    document.querySelectorAll('.voice-line.speaking').forEach((n) => n.classList.remove('speaking'));
  }

  /* ---------- cloud voices (server /api/tts, OpenAI) ---------- */
  const cloud = { enabled: false, audio: new Audio(), resolve: null };

  const enginePref = () => (store.get('vtt.voiceEngine', 'cloud') === 'browser' ? 'browser' : 'cloud');
  const wantCloud = () => cloud.enabled && enginePref() === 'cloud';

  function updateEngineNote() {
    $('#voiceEngine').textContent = enginePref() === 'browser'
      ? 'Voices: Microsoft'
      : cloud.enabled
        ? 'Voices: ChatGPT (OpenAI)'
        : 'ChatGPT voices unavailable (add your OpenAI key in Settings). Using Microsoft voices for now.';
  }

  async function checkCloud() {
    try {
      const s = await api('/api/tts/status');
      cloud.enabled = Boolean(s.enabled);
    } catch { cloud.enabled = false; }
    updateEngineNote();
  }

  function cloudStop() {
    cloud.audio.pause();
    if (cloud.resolve) { const r = cloud.resolve; cloud.resolve = null; r(false); }
  }

  async function fetchClip(line) {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: line.text, voice: line.voice, speaker: line.speaker || 'Narrator' })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || `text-to-speech ${res.status}`);
    }
    return URL.createObjectURL(await res.blob());
  }

  function playClip(url, onstart, tag) {
    return new Promise((resolve) => {
      cloud.resolve = resolve;
      const a = cloud.audio;
      a.onplaying = () => { if (onstart) onstart(); };
      a.onended = () => { cloud.resolve = null; resolve(true); };
      a.onerror = () => { cloud.resolve = null; resolve(false); };
      a.src = url;
      if (window.VoiceFx) VoiceFx.apply(a, tag);
      a.play().catch(() => { cloud.resolve = null; resolve(false); });
    }).finally(() => URL.revokeObjectURL(url));
  }

  // Start every clip request at once so later lines are ready while earlier ones play.
  async function speakCloud(lines, msgEl, gen) {
    const clips = lines.map((l) => fetchClip(l));
    clips.forEach((p) => p.catch(() => {}));
    for (let i = 0; i < lines.length; i++) {
      if (gen !== speakGen) return true;
      let url;
      try { url = await clips[i]; } catch (err) { err.playedCount = i; throw err; }
      if (gen !== speakGen) return true;
      const node = msgEl ? msgEl.querySelector(`.voice-line[data-line="${i}"]`) : null;
      await playClip(url, () => { if (gen === speakGen && node) node.classList.add('speaking'); }, lines[i].voice);
      if (node) node.classList.remove('speaking');
    }
    return true;
  }

  /* ---------- speaking: shared mic muting ---------- */
  function beginSpeaking() {
    cancelSpeech();
    if (window.Ambience) Ambience.duck(true);
    const gen = speakGen;
    // Pause the recognizer while the DM talks so it does not transcribe the speakers.
    if (listening && (continuous || holding)) stopRecognition();
    speaking = true;
    setMicMuted(true);
    return gen;
  }

  function endSpeaking(gen) {
    if (gen !== speakGen) return;
    if (window.Ambience) Ambience.duck(false);
    // Keep the mic deaf briefly after the last word so the tail of the narration is not transcribed.
    ignoreUntil = Date.now() + TAIL_GRACE_MS;
    setTimeout(() => {
      if (gen !== speakGen) return;
      speaking = false;
      setMicMuted(false);
      transcript = ''; interim = '';
      if (continuous) startRecognition();
    }, TAIL_GRACE_MS);
  }

  function speakBrowser(lines, msgEl, offset, gen) {
    if (!synth) { endSpeaking(gen); return; }
    let remaining = lines.length;
    if (!remaining) { endSpeaking(gen); return; }
    const done = () => {
      if (gen !== speakGen) return;
      if (--remaining === 0) endSpeaking(gen);
    };
    lines.forEach((line, k) => {
      const profile = VOICE_PROFILES[line.voice] || VOICE_PROFILES.narrator;
      const u = new SpeechSynthesisUtterance(line.text);
      const v = pickVoice(line.speaker || 'Narrator', line.voice);
      if (v) { u.voice = v; u.lang = v.lang; }
      u.pitch = profile.pitch;
      u.rate = profile.rate;
      const node = msgEl ? msgEl.querySelector(`.voice-line[data-line="${offset + k}"]`) : null;
      u.onstart = () => { if (gen === speakGen && node) node.classList.add('speaking'); };
      u.onend = () => { if (node) node.classList.remove('speaking'); done(); };
      u.onerror = () => { if (node) node.classList.remove('speaking'); done(); };
      synth.speak(u);
    });
  }

  function speak(lines, msgEl) {
    if (!$('#speakToggle').checked) return;
    const gen = beginSpeaking();
    if (!wantCloud()) { speakBrowser(lines, msgEl, 0, gen); return; }
    speakCloud(lines, msgEl, gen)
      .then(() => endSpeaking(gen))
      .catch((err) => {
        if (gen !== speakGen) return;
        toast(`ChatGPT voice failed (${err.message}). Using Microsoft voices.`, 'error', 5000);
        speakBrowser(lines.slice(err.playedCount || 0), msgEl, err.playedCount || 0, gen);
      });
  }

  function init() {
    if (synth) synth.getVoices(); // kick off async voice loading in Chrome
    if (synth && 'onvoiceschanged' in synth) synth.onvoiceschanged = () => { assigned.clear(); };
    checkCloud();
    // Back from the Settings page: pick up a new key, engine or narrator voice.
    window.addEventListener('focus', () => { assigned.clear(); checkCloud(); });
    const btn = $('#micBtn');
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); beginHold(); });
    btn.addEventListener('pointerup', endHold);
    btn.addEventListener('pointercancel', endHold);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
    $('#micToggleBtn').addEventListener('click', toggleContinuous);
    $('#stopSpeechBtn').addEventListener('click', cancelSpeech);
    $('#speakToggle').addEventListener('change', (e) => { if (!e.target.checked) cancelSpeech(); });
    // Spacebar push-to-talk while the chat tab is open and no field has focus.
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || e.repeat) return;
      if (/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(document.activeElement?.tagName)) return;
      if (!$('#panel-chat').classList.contains('active')) return;
      e.preventDefault();
      beginHold();
    });
    window.addEventListener('keyup', (e) => { if (e.code === 'Space') endHold(); });
    window.addEventListener('beforeunload', () => { if (synth) synth.cancel(); releaseMic(); });
    reflectUi();
  }

  return { init, speak, cancelSpeech, ensureMic };
})();

// Sheet changes the DM made were already saved by the server; show them and refresh the table's copy of each character.
function applyCharacterUpdates(updates, problems) {
  let changed = false;
  for (const u of Array.isArray(updates) ? updates : []) {
    if (!u || !u.character) continue;
    const i = state.characters.findIndex((c) => c.id === u.character.id);
    if (i >= 0) state.characters[i] = u.character; else state.characters.push(u.character);
    for (const note of Array.isArray(u.notes) ? u.notes : []) addChat('system', `↳ ${u.name}: ${note}`);
    if (u.readyLevel) addChat('system', `★ ${u.name} has enough XP to reach level ${u.readyLevel}. Ask the DM to level up.`);
    changed = true;
  }
  for (const p of Array.isArray(problems) ? problems : []) addChat('system', `⚠ ${p}`);
  if (changed) {
    syncTokensWithCharacters();
    commitBoard();
  }
}

async function applyMapUpdates(updates) {
  if (!updates.length) return;
  const travel = updates.find((u) => u.type === 'changeMap');
  if (travel) await travelTo(travel);
  let wallsTouched = false;
  const hpSaves = [];
  for (const u of updates) {
    switch (u.type) {
      case 'moveToken': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (!t || !Number.isInteger(u.col) || !Number.isInteger(u.row)) break;
        const fromX = centerOf(t.col), fromY = centerOf(t.row);
        let col = clamp(u.col, 0, cols() - 1), row = clamp(u.row, 0, rows() - 1);
        // The DM's moves obey the table's walls and the token's speed: a move that cannot be done stops at the nearest square that can.
        if (!plainMap() && !(col === t.col && row === t.row)) {
          const saved = t.movementRemaining;
          t.movementRemaining = effectiveSpeed(t);
          const reach = reachable(t);
          t.movementRemaining = saved;
          if (!reach.has(sqKey(col, row))) {
            let best = null, bestD = Math.hypot(col - t.col, row - t.row);
            for (const k of reach.keys()) {
              const [c, r] = k.split(',').map(Number);
              const d = Math.hypot(col - c, row - r);
              if (d < bestD) { bestD = d; best = { c, r }; }
            }
            const note = `${t.name} could not reach (${col}, ${row}) (speed ${effectiveSpeed(t)} ft and the walls): it went to (${best ? best.c : t.col}, ${best ? best.r : t.row}) instead`;
            state.pendingCorrections.push(note);
            if (seenByParty(t)) addChat('system', '↳ ' + note);
            if (best) { col = best.c; row = best.r; } else { col = t.col; row = t.row; }
          }
        }
        t.col = col;
        t.row = row;
        animateToken(t, fromX, fromY);
        if (seenByParty(t)) addChat('system', `↳ ${t.name} moved to (${t.col}, ${t.row})`);
        break;
      }
      case 'addToken': {
        if (!u.tokenId || !Number.isInteger(u.col) || !Number.isInteger(u.row)) break;
        const existing = state.tokens.find((x) => x.id === u.tokenId);
        const spot = existing ? { col: clamp(u.col, 0, cols() - 1), row: clamp(u.row, 0, rows() - 1) } : freeSquareNear(u.col, u.row);
        let token = existing;
        if (existing) {
          Object.assign(existing, spot, { name: u.name || existing.name, color: /^#[0-9a-f]{6}$/i.test(u.color || '') ? u.color : existing.color });
          if (typeof u.hidden === 'boolean') existing.hidden = u.hidden;
          if (u.kind === 'trap' || u.kind === 'creature') existing.kind = u.kind;
        } else {
          token = makeToken({
            id: String(u.tokenId),
            name: u.name || 'Creature',
            color: /^#[0-9a-f]{6}$/i.test(u.color || '') ? u.color : '#a04545',
            isPC: false,
            hidden: u.hidden === true,
            kind: u.kind,
            speed: Number.isFinite(Number(u.speed)) && Number(u.speed) > 0 ? Number(u.speed) : 30,
            ...spot
          });
          if (Number(u.maxHp) > 0) Object.assign(token, { hp: Number(u.maxHp), maxHp: Number(u.maxHp) });
          if (Number(u.ac) > 0) token.ac = Number(u.ac);
          if (u.monster) token.monster = String(u.monster);
          if (/^\/tokens\/[\w.-]+$/.test(String(u.image || ''))) token.image = u.image;
          if (Number.isFinite(Number(u.dexMod))) token.dexMod = Number(u.dexMod);
          state.tokens.push(token);
          joinCombat(token);
        }
        // Nothing is said in the chat about a token the players cannot see.
        if (seenByParty(token)) addChat('system', `↳ ${u.name || u.tokenId} appears at (${spot.col}, ${spot.row})`);
        break;
      }
      case 'removeToken': {
        const idx = state.tokens.findIndex((x) => x.id === u.tokenId);
        if (idx < 0) break;
        const wasSeen = seenByParty(state.tokens[idx]);
        const [removed] = state.tokens.splice(idx, 1);
        if (idx < state.activeIndex || state.activeIndex >= state.tokens.length) state.activeIndex = Math.max(0, state.activeIndex - 1);
        if (wasSeen) addChat('system', `↳ ${removed.name} removed from the board`);
        break;
      }
      case 'revealToken': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (!t) break;
        t.hidden = false;
        addChat('system', `↳ ${t.name} is revealed at (${t.col}, ${t.row})`);
        break;
      }
      case 'hideToken': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (t && !t.isPC) t.hidden = true;
        break;
      }
      case 'setHp': {
        const c = state.characters.find((x) => x.id === u.characterId)
          || characterFor(state.tokens.find((x) => x.id === u.characterId || x.id === u.tokenId));
        if (!c || !Number.isFinite(u.hp)) break;
        const before = c.hp;
        c.hp = clamp(Math.round(u.hp), 0, c.maxHp);
        hpSaves.push(c);
        addChat('system', `↳ ${c.name} HP ${before} → ${c.hp}/${c.maxHp}`);
        break;
      }
      case 'addWall': {
        if (![u.x1, u.y1, u.x2, u.y2].every(Number.isFinite)) break;
        state.walls.push({ x1: u.x1, y1: u.y1, x2: u.x2, y2: u.y2, type: u.wallType === 'door' ? 'door' : 'wall', open: false });
        wallsTouched = true;
        addChat('system', `↳ A ${u.wallType === 'door' ? 'door' : 'wall'} was added to the map`);
        break;
      }
      case 'addCondition': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        const rounds = Number(u.rounds);
        if (!t || !setCondition(t, u.condition, rounds)) break;
        if (seenByParty(t)) addChat('system', `↳ ${t.name} is ${conditionKey(u.condition)}${rounds > 0 ? ` (${rounds} round${rounds === 1 ? '' : 's'})` : ''}`);
        break;
      }
      case 'removeCondition': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (t && clearCondition(t, u.condition) && seenByParty(t)) addChat('system', `↳ ${t.name} is no longer ${conditionKey(u.condition)}`);
        break;
      }
      case 'damageToken':
      case 'healToken': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        const amount = Math.abs(Math.round(Number(u.value)));
        if (!t || !(amount > 0)) break;
        const r = changeHp(t, u.type === 'damageToken' ? -amount : amount);
        if (r && seenByParty(t) && !t.isPC) addChat('system', `↳ ${t.name} ${u.type === 'damageToken' ? 'takes' : 'recovers'} ${amount}`);
        break;
      }
      case 'setInitiative': {
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (!t || !Number.isFinite(Number(u.value))) break;
        t.initiative = Math.round(Number(u.value));
        if (state.combat.active) { if (!state.combat.order.includes(t.id)) joinCombat(t); sortCombat(); }
        break;
      }
      case 'restParty':
        restTokens(u.kind);
        break;
      case 'setMood':
        state.mood = Ambience.moods.includes(u.mood) && u.mood !== 'calm' ? u.mood : '';
        syncAmbience();
        if (u.mood === 'triumph') Ambience.setMood('triumph');
        break;
      case 'playSound':
        Ambience.sfx(u.sound);
        break;
      case 'summonToken': {
        const owner = state.tokens.find((x) => x.id === u.ownerId) || activeToken();
        const t = SUMMONS[u.kind] ? conjure(u.kind, owner, u.tokenId, u.col, u.row) : null;
        if (!t) addChat('system', `The DM tried to conjure something unknown (${u.kind}).`);
        break;
      }
      case 'lightToken': {
        // A token that carries a light, or one of the map's own lights (a campfire, a torch).
        const t = state.tokens.find((x) => x.id === u.tokenId);
        if (t) { t.lightKind = LIGHT_KINDS[u.kind] ? u.kind : ''; if (seenByParty(t)) addChat('system', `↳ ${t.name} ${t.lightKind ? 'lights a ' + LIGHT_KINDS[t.lightKind][2].toLowerCase() : 'puts out their light'}`); }
        else if (state.lights.some((l) => l.id === u.tokenId)) { setMapLight(u.tokenId, Number(u.value) !== 0); addChat('system', `↳ The ${u.tokenId} ${Number(u.value) !== 0 ? 'is lit' : 'goes out'}`); }
        break;
      }
      case 'startCombat':
        if (!state.combat.active) startCombat();
        break;
      case 'endCombat':
        endCombat();
        break;
      case 'changeMap':
        break;                                    // handled before the loop
      default:
        console.warn('Unknown map update', u);
    }
  }
  if (wallsTouched) wallsChanged();
  for (const c of hpSaves) {
    jsonPost('/api/characters', c).catch((err) => toast(`Could not save ${c.name}'s HP: ${err.message}`, 'error'));
  }
  revealFog();
  commitBoard();
}

/* =====================================================================
   UI: CHARACTER SHEETS
   ===================================================================== */
async function loadCharacters() {
  try {
    const list = await api('/api/characters');
    state.characters = Array.isArray(list) ? list : [];
  } catch (err) {
    state.characters = [];
    toast(`Could not load characters: ${err.message}`, 'error');
  }
  syncTokensWithCharacters();
}

function placeCharacterToken(c, center = true) {
  let t = state.tokens.find((x) => x.characterId === c.id);
  if (!t) {
    const mid = screenToWorld(wrap.clientWidth / 2, wrap.clientHeight / 2);
    const cell = worldToCell(mid.x, mid.y);
    const spot = freeSquareNear(clamp(cell.col, 0, cols() - 1), clamp(cell.row, 0, rows() - 1));
    t = makeToken({ id: `tok-${c.id}`, name: c.name, color: c.color, characterId: c.id, col: spot.col, row: spot.row, speed: c.speed, image: c.image || '' });
    state.tokens.push(t);
    revealFog();
  }
  if (center) centerOnToken(t);
  return t;
}

/* =====================================================================
   TOKEN LIBRARY & TOKEN ART
   ===================================================================== */
function prettyMapName(url) {
  const base = String(url || '').split('/').pop().replace(/\.[a-z0-9]+$/i, '').replace(/-[0-9a-z]{6,10}$/, (m) => (/\d/.test(m) && /[a-z]/.test(m) ? '' : m));
  return base.split('-').filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ') || 'Map';
}

function removeTokenAt(t) {
  if (t.characterId) { toast(`${t.name} is a party character. Delete the sheet to remove them.`); return; }
  if (!confirm(`Remove ${t.name} from the map?`)) return;
  const idx = state.tokens.indexOf(t);
  state.tokens.splice(idx, 1);
  if (idx < state.activeIndex || state.activeIndex >= state.tokens.length) state.activeIndex = Math.max(0, state.activeIndex - 1);
  revealFog();
  commitBoard();
}

/* =====================================================================
   UI: MAP TOOLS
   ===================================================================== */
/* =====================================================================
   EVENT BINDINGS
   ===================================================================== */
function bindUi() {
  $('#moveRule').addEventListener('change', (e) => {
    if (!MOVE_RULES.includes(e.target.value)) return;
    state.moveRule = e.target.value;
    store.set('vtt.moveRule', state.moveRule);
    requestRender();
  });
  $('#mapPick').addEventListener('change', async (e) => {
    const p = state.places.find((x) => x.url === e.target.value);
    if (p) await travelTo({ mapUrl: p.url, mapName: p.name, kind: p.kind, col: p.start.col, row: p.start.row, px: p.startPx });
  });
  $('#resetFogBtn').addEventListener('click', () => {
    if (!state.fogEnabled) { toast('Turn on Fog of war first.'); return; }
    if (confirm('Cover the whole map in fog again? Explored areas will be forgotten.')) resetFog();
  });
  $('#fogToggle').addEventListener('change', (e) => {
    state.fogEnabled = e.target.checked;
    saveBoard();
    revealFog();
    renderTurnBar();
  });
  $('#dmView').addEventListener('change', (e) => {
    state.dmView = e.target.checked;
    store.set('vtt.dmView', state.dmView);
    renderTurnBar();
    requestRender();
  });
  $('#endTurnBtn').addEventListener('click', endTurn);
  // Sidebar tabs: the table (chat and combat), the campaign journal and the party. The last two are the Journal and Party pages shown here.
  const showTab = (name) => {
    document.querySelectorAll('.sidebar .tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    for (const id of ['chat', 'journal', 'party']) $('#panel-' + id).classList.toggle('active', id === name);
    $('#combatPanel').style.display = name === 'chat' ? '' : 'none';
    if (name === 'journal') $('#frameJournal').src = '/journal.html?embed=1&t=' + Date.now();     // reloaded each time, so it shows what the DM just wrote
    if (name === 'party') $('#frameParty').src = '/party.html?embed=1&t=' + Date.now();
    store.set('vtt.sideTab', name);
  };
  document.querySelectorAll('.sidebar .tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('#lightBtn').addEventListener('click', openLightPanel);
  $('#ambienceToggle').addEventListener('change', (e) => { store.set('vtt.ambience', e.target.checked); Ambience.setEnabled(e.target.checked); if (e.target.checked) { Ambience.resume(); syncAmbience(); } });
  $('#ambienceVol').addEventListener('input', (e) => { store.set('vtt.ambienceVol', Number(e.target.value)); Ambience.setVolume(e.target.value / 100); });
  // Browsers allow sound only after a click or key press: the first one starts the ambience.
  const startAudio = () => { if (store.get('vtt.ambience', true) !== false) { Ambience.resume(); syncAmbience(); } };
  document.addEventListener('pointerdown', startAudio, { once: true });
  document.addEventListener('keydown', startAudio, { once: true });
  $('#sceneSave').addEventListener('click', saveScene);
  $('#scenePick').addEventListener('change', (e) => { $('#sceneDelete').disabled = !e.target.value; if (e.target.value) applyScene(e.target.value); });
  $('#sceneDelete').addEventListener('click', () => deleteScene($('#scenePick').value));
  $('#diceMode').addEventListener('change', (e) => { store.set('vtt.diceMode', e.target.value); syncDiceUi(); });
  $('#sendAttackRoll').addEventListener('click', () => sendAttackRoll($('#attackRoll').value));
  $('#attackRoll').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendAttackRoll($('#attackRoll').value); });
  $('#autoAttackRoll').addEventListener('click', () => sendAttackRoll(d20()));
  $('#zoomInBtn').addEventListener('click', () => zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 1.25));
  $('#zoomOutBtn').addEventListener('click', () => zoomAt(wrap.clientWidth / 2, wrap.clientHeight / 2, 0.8));
  $('#fitBtn').addEventListener('click', fitView);

  voice.init();
  $('#sendBtn').addEventListener('click', () => sendTurn());
  $('#chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendTurn(); }
  });
  $('#pauseBtn').addEventListener('click', () => sendTurn('[PAUSE] I am pressing the pause button. Please stop the scene here.', { typed: true }));
  $('#recapBtn').addEventListener('click', async () => {
    if (state.busy) return;
    voice.cancelSpeech();
    setBusy(true);
    try {
      const data = await jsonPost('/api/recap', {});
      const lines = Array.isArray(data.voiceLines) ? data.voiceLines : [];
      const msgEl = addChat('assistant', '📖 Previously on…\n\n' + data.narrative, lines);
      if (lines.length) voice.speak(lines, msgEl);
    } catch (err) {
      addChat('system', 'Could not get a recap: ' + err.message);
    } finally {
      setBusy(false);
    }
  });
  $('#clearChatBtn').addEventListener('click', () => {
    if (!confirm('Clear the whole chat log? The DM will lose this conversation history.')) return;
    state.chat = [];
    store.set(chatKey(), state.chat);
    renderChat();
  });

  new ResizeObserver(() => {
    resizeCanvas();
    if (!sized && wrap.clientWidth && wrap.clientHeight) { sized = true; focusStart(); }
  }).observe(wrap);
  window.matchMedia(`(resolution: ${dpr}dppx)`).addEventListener?.('change', resizeCanvas);
}

/* =====================================================================
   INIT
   ===================================================================== */
async function init() {
  bindUi();
  // The active campaign decides which saved board and chat to load.
  let active = null;
  try { active = ((await api('/api/campaigns')).campaigns || []).find((c) => c.active) || null; } catch { /* the table still works without it */ }
  state.campaignId = active ? active.id : 'default';
  let board = store.get(boardKey(), null);
  // A campaign with a ready-made starting scene (and no saved board yet) begins there.
  if (!board && window.Scenes && Scenes.has(state.campaignId)) {
    try {
      board = await Scenes.create(state.campaignId);
      if (board && board.mapUrl) store.remove('vtt.fog.' + board.mapUrl);
    } catch (err) { toast(`Could not build the starting scene: ${err.message}`, 'error', 6000); }
  }
  const savedRule = store.get('vtt.moveRule', 'circle');
  if (MOVE_RULES.includes(savedRule)) state.moveRule = savedRule;
  $('#moveRule').value = state.moveRule;
  state.dmView = store.get('vtt.dmView', false) === true;
  $('#dmView').checked = state.dmView;
  state.chat = store.get(chatKey(), []);
  if (!Array.isArray(state.chat)) state.chat = [];
  if (board && typeof board === 'object') {
    state.tokens = Array.isArray(board.tokens) ? board.tokens.filter((t) => t && t.id) : [];
    state.activeIndex = Number.isInteger(board.activeIndex) ? board.activeIndex : 0;
    state.fogEnabled = board.fogEnabled !== false;
    state.gridOpacity = Number.isFinite(board.gridOpacity) ? board.gridOpacity : 0.35;
    state.zoomToParty = board.zoomToParty === true;
    // Boards saved before the kind was recorded: the Sword Coast map is the overland one.
    state.mapKind = board.mapKind === 'town' ? 'town' : board.mapKind === 'regional' || board.mapKind === 'overland' || (!board.mapKind && /northswordcoast/.test(board.mapUrl || '')) ? 'regional' : board.mapKind === 'camp' ? 'camp' : 'battle';
    state.mapMemory = board.mapMemory && typeof board.mapMemory === 'object' ? board.mapMemory : {};
    state.fogBeforeOverland = typeof board.fogBeforeOverland === 'boolean' ? board.fogBeforeOverland : null;
    state.lightsOff = board.lightsOff && typeof board.lightsOff === 'object' ? board.lightsOff : {};
    state.ambientOverride = ['bright', 'dim', 'dark'].includes(board.ambientOverride) ? board.ambientOverride : '';
    state.combat = board.combat && board.combat.active && Array.isArray(board.combat.order) ? { active: true, round: Math.max(1, Number(board.combat.round) || 1), order: board.combat.order.map(String) } : { active: false, round: 0, order: [] };
  }
  $('#fogToggle').checked = state.fogEnabled;
  syncMapUi();
  syncDiceUi();
  syncScenePick();
  syncAmbienceUi();
  renderChat();
  scrollChat();
  await loadCharacters();
  if (!state.tokens.length) createDefaultTokens();
  await setMap(board?.mapUrl || null);
  if (state.zoomToParty) focusStart();
  if (!state.chat.length) {
    let campaignNote = '';
    if (active) campaignNote = active.totalChars ? ` Campaign: ${active.name} (${active.files.length} documents loaded).` : ` Campaign: ${active.name} has no text loaded, so the DM is improvising. Add it on the Campaigns page.`;
    addChat('system', `Welcome to AI-VTT. Drag the highlighted token to move (gold outline = legal range), press End Turn to pass, and describe actions here for the AI Dungeon Master.${campaignNote}`);
  }
  commitBoard();
  loadPlaces();
  // Coming back from the Campaigns page after switching: load the other campaign's board and chat.
  window.addEventListener('focus', async () => {
    if (state.campaignId === 'default') return;
    try {
      const now = ((await api('/api/campaigns')).campaigns || []).find((c) => c.active);
      if (now && now.id !== state.campaignId) location.reload();
    } catch { /* offline: stay where we are */ }
  });
}

// Debug handle for inspection in the browser console.
window.vtt = { state, interaction, reachable, visibilityPolygon, endTurn, setMap, fitView, screenToWorld, centerOf, revealFog, resetFog, seenByParty, travelTo, restTokens, applyMapUpdates, objectLoops, fogAlphaAt: (x, y) => [sctx.getImageData(Math.round(x), Math.round(y), 1, 1).data[3], vctx.getImageData(Math.round(x), Math.round(y), 1, 1).data[3]], lightLevelAt, allLights, setMapLight, loadMapLighting, changeHp, startCombat, endCombat, nextCombatTurn };

init().catch((err) => {
  console.error(err);
  toast(`Startup failed: ${err.message}`, 'error', 6000);
});
</script>
