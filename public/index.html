<script>
'use strict';

/* =====================================================================
   CONSTANTS & STATE
   ===================================================================== */
const GRID = 50;              // world pixels per 5-ft square
const FT_PER_SQUARE = 5;
const VISION_FT = 60;
const DEFAULT_COLS = 30;
const DEFAULT_ROWS = 20;
const MIN_SCALE = 0.15;
const MAX_SCALE = 4;
const ABILITIES = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
const DEFAULT_TOKENS = [
  { name: 'Hero 1', color: '#e5534b' },
  { name: 'Hero 2', color: '#4f9dff' },
  { name: 'Hero 3', color: '#57c47a' },
  { name: 'Hero 4', color: '#e3b341' }
];
const START_SQUARES = [[2, 2], [3, 2], [2, 3], [3, 3]];

const state = {
  map: { url: null, img: null, width: DEFAULT_COLS * GRID, height: DEFAULT_ROWS * GRID, drawW: 0, drawH: 0 },
  view: { scale: 1, ox: 0, oy: 0 },
  tokens: [],
  activeIndex: 0,
  walls: [],
  wallsVersion: 0,
  characters: [],
  chat: [],
  fogEnabled: true,
  gridOpacity: 0.35,
  drawWalls: false,
  wallType: 'wall',
  gmOverride: false,
  busy: false,
  moveRule: 'circle',
  campaignId: null,
  zoomToParty: false,
  mapKind: 'battle',          // 'regional' and 'town' maps are plain pictures (no grid, no fog, no tokens); 'battle' maps have all three
  mapMemory: {},              // per map: the creatures and party positions left there, restored when the party returns
  fogBeforeOverland: null,
  combat: { active: false, round: 0, order: [] },
  wallsInPicture: false,
  pendingCorrections: [],            // moves the table adjusted; told to the DM with the next message
  ambience: '',                      // the map's ambient sound ('' = pick one from the kind of place)
  mood: '',                          // a mood the DM asked for ('' = none; combat sets its own)
  ambient: 'bright',                 // the map's light level: 'bright', 'dim' or 'dark' (from its config)
  ambientOverride: '',               // the table's own choice, '' = use the map's
  lights: [],                        // the map's own light sources
  lightsOff: {},                     // per map: ids of map lights that were put out
  places: [],                 // the maps this campaign can move to
  dmView: false,
  sight: []
};

const interaction = {
  mode: null,          // 'drag' | 'wall' | 'pan' | 'pinch' | null
  pointers: new Map(), // pointerId -> {x, y} (screen)
  token: null,
  offX: 0, offY: 0,
  wx: 0, wy: 0,
  wallStart: null,
  wallEnd: null,
  panStart: null,
  pinch: null,
  hoverSquare: null
};

/* =====================================================================
   SAFE STORAGE
   ===================================================================== */
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw == null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
  },
  getRaw(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  },
  setRaw(key, value) {
    try { localStorage.setItem(key, value); return true; } catch { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); } catch { /* storage unavailable */ }
  }
};
const mapKey = () => state.map.url || 'default';
// Each campaign keeps its own board and chat, so switching campaigns brings back where you were.
const boardKey = () => `vtt.board.${state.campaignId || 'default'}`;
const chatKey = () => `vtt.chat.${state.campaignId || 'default'}`;
const wallsKey = () => `vtt.walls.${mapKey()}`;
const fogKey = () => `vtt.fog.${mapKey()}`;

/* =====================================================================
   DOM HELPERS
   ===================================================================== */
const $ = (sel) => document.querySelector(sel);
const canvas = $('#board');
const ctx = canvas.getContext('2d');
const wrap = $('#canvasWrap');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const mod = (score) => Math.floor((Number(score) - 10) / 2);
const fmtMod = (m) => (m >= 0 ? `+${m}` : `${m}`);
const initials = (name) => String(name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

function toast(message, kind = 'info', ms = 2600) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = message;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

async function api(path, options = {}) {
  const res = await fetch(path, options);
  let data = null;
  try { data = await res.json(); } catch { data = null; }
  if (!res.ok) throw new Error(data?.error || `${res.status} ${res.statusText}`);
  return data;
}
const jsonPost = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

/* =====================================================================
   COORDINATES & VIEW
   ===================================================================== */
let dpr = window.devicePixelRatio || 1;
let sized = false;
const cols = () => Math.ceil(state.map.width / GRID);
const rows = () => Math.ceil(state.map.height / GRID);
const centerOf = (cell) => cell * GRID + GRID / 2;
const sqKey = (c, r) => `${c},${r}`;

function screenToWorld(sx, sy) {
  const v = state.view;
  return { x: (sx - v.ox) / v.scale, y: (sy - v.oy) / v.scale };
}
function eventPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function worldToCell(x, y) {
  return { col: Math.floor(x / GRID), row: Math.floor(y / GRID) };
}
function inBounds(col, row) {
  return col >= 0 && row >= 0 && col < cols() && row < rows();
}

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  requestRender();
}

function fitView() {
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  if (!w || !h) return;
  const v = state.view;
  v.scale = clamp(Math.min(w / state.map.width, h / state.map.height) * 0.94, MIN_SCALE, MAX_SCALE);
  v.ox = (w - state.map.width * v.scale) / 2;
  v.oy = (h - state.map.height * v.scale) / 2;
  updateHud();
  requestRender();
}

function zoomAt(sx, sy, factor) {
  const v = state.view;
  const before = screenToWorld(sx, sy);
  v.scale = clamp(v.scale * factor, MIN_SCALE, MAX_SCALE);
  v.ox = sx - before.x * v.scale;
  v.oy = sy - before.y * v.scale;
  updateHud();
  requestRender();
}

// Regional and town maps are plain pictures: no tokens, no fog, no movement, shown whole. A camp map shows tokens and the grid but has no fog of war.
function plainMap() { return state.mapKind === 'regional' || state.mapKind === 'town'; }
function noFogMap() { return state.mapKind !== 'battle'; }

// Opening view for boards that ask for it (a big battle map is too large to show whole): close on the active token.
function focusStart() {
  if (plainMap()) { fitView(); return; }
  const t = activeToken();
  if (state.zoomToParty && t) {
    // A large battle map opens about 35 squares wide around the party.
    state.view.scale = clamp(wrap.clientWidth / (35 * GRID), 0.3, 1);
    centerOnToken(t);
  } else fitView();
}

function centerOnToken(t) {
  const v = state.view;
  v.ox = wrap.clientWidth / 2 - centerOf(t.col) * v.scale;
  v.oy = wrap.clientHeight / 2 - centerOf(t.row) * v.scale;
  requestRender();
}

/* =====================================================================
   GEOMETRY: SEGMENT INTERSECTION & RAYCASTING
   ===================================================================== */
const cross = (ax, ay, bx, by) => ax * by - ay * bx;

// Does segment p1->p2 intersect wall segment w? (endpoints inclusive)
function segmentsIntersect(p1x, p1y, p2x, p2y, w) {
  const dx = p2x - p1x, dy = p2y - p1y;
  const ex = w.x2 - w.x1, ey = w.y2 - w.y1;
  const den = cross(dx, dy, ex, ey);
  if (Math.abs(den) < 1e-9) return false;
  const sx = w.x1 - p1x, sy = w.y1 - p1y;
  const r = cross(sx, sy, ex, ey) / den;
  const u = cross(sx, sy, dx, dy) / den;
  return r >= 0 && r <= 1 && u >= 0 && u <= 1;
}

// Distance along ray (origin p, unit dir d) to the nearest segment hit.
function castRay(px, py, dx, dy, segments) {
  let best = Infinity;
  for (const s of segments) {
    const ex = s.x2 - s.x1, ey = s.y2 - s.y1;
    const den = cross(dx, dy, ex, ey);
    if (Math.abs(den) < 1e-12) continue;
    const sx = s.x1 - px, sy = s.y1 - py;
    const r = cross(sx, sy, ex, ey) / den;
    const u = cross(sx, sy, dx, dy) / den;
    if (r >= 0 && u >= -1e-9 && u <= 1 + 1e-9 && r < best) best = r;
  }
  return best;
}

function pointSegmentDistance(px, py, w) {
  const ex = w.x2 - w.x1, ey = w.y2 - w.y1;
  const len2 = ex * ex + ey * ey;
  let t = len2 ? ((px - w.x1) * ex + (py - w.y1) * ey) / len2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (w.x1 + t * ex), py - (w.y1 + t * ey));
}

const blockingWalls = () => state.walls.filter((w) => !(w.type === 'door' && w.open));

// Visibility polygon: cast rays at every wall endpoint (±epsilon) plus a uniform fan.
function visibilityPolygon(ox, oy) {
  const W = state.map.width, H = state.map.height;
  const segments = blockingWalls().concat([
    { x1: 0, y1: 0, x2: W, y2: 0 },
    { x1: W, y1: 0, x2: W, y2: H },
    { x1: W, y1: H, x2: 0, y2: H },
    { x1: 0, y1: H, x2: 0, y2: 0 }
  ]);
  const angles = [];
  for (const s of segments) {
    const a1 = Math.atan2(s.y1 - oy, s.x1 - ox);
    const a2 = Math.atan2(s.y2 - oy, s.x2 - ox);
    angles.push(a1 - 1e-5, a1, a1 + 1e-5, a2 - 1e-5, a2, a2 + 1e-5);
  }
  const FAN = 90;
  for (let i = 0; i < FAN; i++) angles.push(-Math.PI + (i / FAN) * Math.PI * 2);
  angles.sort((a, b) => a - b);
  const points = [];
  for (const a of angles) {
    const dx = Math.cos(a), dy = Math.sin(a);
    const dist = castRay(ox, oy, dx, dy, segments);
    if (dist !== Infinity) points.push({ x: ox + dx * dist, y: oy + dy * dist });
  }
  return points;
}

function moveBlocked(c1, r1, c2, r2, walls) {
  const x1 = centerOf(c1), y1 = centerOf(r1), x2 = centerOf(c2), y2 = centerOf(r2);
  for (const w of walls) {
    if (segmentsIntersect(x1, y1, x2, y2, w)) return true;
  }
  return false;
}

/* =====================================================================
   MOVEMENT POOL / REACHABILITY (5e: diagonals cost 5 ft)
   ===================================================================== */
let reachCache = { sig: '', map: new Map() };

// Movement range, by rule. Every function returns a Map of square key -> feet of movement needed.
//   standard    (PHB)  every square costs 5 ft, diagonals too, so the range is a square
//   alternating (DMG)  diagonals cost 5 ft, then 10 ft, then 5 ft...
//   circle      (house rule) straight-line distance; a diagonal step is about 7 ft
const MOVE_RULES = ['circle', 'standard', 'alternating'];
const SQRT2 = Math.SQRT2;

function reachStandard(token, radiusFt, near) {
  const maxSteps = Number.isFinite(radiusFt) ? Math.floor(radiusFt / FT_PER_SQUARE) : Infinity;
  const steps = new Map([[sqKey(token.col, token.row), 0]]);
  const queue = [[token.col, token.row]];
  for (let i = 0; i < queue.length; i++) {
    const [c, r] = queue[i];
    const d = steps.get(sqKey(c, r));
    if (d >= maxSteps) continue;
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc === 0 && dr === 0) continue;
        const nc = c + dc, nr = r + dr;
        if (!inBounds(nc, nr)) continue;
        const k = sqKey(nc, nr);
        if (steps.has(k)) continue;
        if (near.length && moveBlocked(c, r, nc, nr, near)) continue;
        steps.set(k, d + 1);
        queue.push([nc, nr]);
      }
    }
  }
  const cost = new Map();
  for (const [k, n] of steps) cost.set(k, n * FT_PER_SQUARE);
  return cost;
}

function reachAlternating(token, radiusFt, near) {
  // State is (square, diagonal steps so far mod 2): the first diagonal costs 5 ft, the second 10 ft, and so on.
  const best = new Map([[`${token.col},${token.row},0`, 0]]);
  const queue = [[token.col, token.row, 0]];
  for (let i = 0; i < queue.length; i++) {
    const [c, r, p] = queue[i];
    const here = best.get(`${c},${r},${p}`);
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (dc === 0 && dr === 0) continue;
        const nc = c + dc, nr = r + dr;
        if (!inBounds(nc, nr) || (near.length && moveBlocked(c, r, nc, nr, near))) continue;
        const diagonal = dc !== 0 && dr !== 0;
        const next = here + (diagonal ? (p === 0 ? 5 : 10) : 5);
        const np = diagonal ? 1 - p : p;
        const k = `${nc},${nr},${np}`;
        if (next > radiusFt + 1e-9 || next >= (best.get(k) ?? Infinity)) continue;
        best.set(k, next);
        queue.push([nc, nr, np]);
      }
    }
  }
  const cost = new Map();
  for (const [k, v] of best) {
    const sq = k.slice(0, k.lastIndexOf(','));
    if (v < (cost.get(sq) ?? Infinity)) cost.set(sq, v);
  }
  return cost;
}

function reachCircle(token, radiusFt, R, near) {
  const cost = new Map([[sqKey(token.col, token.row), 0]]);
  // Squares with a clear straight line cost their straight-line distance.
  for (let dc = -R; dc <= R; dc++) {
    for (let dr = -R; dr <= R; dr++) {
      if (dc === 0 && dr === 0) continue;
      const d = Math.hypot(dc, dr) * FT_PER_SQUARE;
      if (d > radiusFt + 1e-9) continue;
      const c = token.col + dc, r = token.row + dr;
      if (!inBounds(c, r)) continue;
      if (near.length && moveBlocked(token.col, token.row, c, r, near)) continue;
      cost.set(sqKey(c, r), d);
    }
  }
  if (near.length) {
    // Squares hidden behind a wall cost the walk around it: relax outward one step at a time.
    const queue = [...cost.keys()];
    for (let i = 0; i < queue.length; i++) {
      const [c, r] = queue[i].split(',').map(Number);
      const here = cost.get(queue[i]);
      for (let dc = -1; dc <= 1; dc++) {
        for (let dr = -1; dr <= 1; dr++) {
          if (dc === 0 && dr === 0) continue;
          const nc = c + dc, nr = r + dr;
          if (!inBounds(nc, nr) || moveBlocked(c, r, nc, nr, near)) continue;
          const next = here + (dc !== 0 && dr !== 0 ? SQRT2 : 1) * FT_PER_SQUARE;
          const k = sqKey(nc, nr);
          if (next > radiusFt + 1e-9 || next >= (cost.get(k) ?? Infinity) - 1e-9) continue;
          cost.set(k, next);
          queue.push(k);
        }
      }
    }
  }
  return cost;
}

function reachable(token) {
  if (!token) return new Map();
  const rule = state.gmOverride ? 'standard' : state.moveRule;
  const leashOwner = token.summon ? state.tokens.find((o) => o.id === token.summon.ownerId) : null;
  const sig = `${rule}|${token.id}|${token.col},${token.row}|${token.movementRemaining}|${state.wallsVersion}|${state.gmOverride}|${cols()}x${rows()}|${leashOwner ? leashOwner.col + ',' + leashOwner.row : ''}|` +
    state.tokens.map((t) => sqKey(t.col, t.row)).join(';');
  if (reachCache.sig === sig) return reachCache.map;

  const radiusFt = state.gmOverride ? Infinity : token.movementRemaining;
  const R = Number.isFinite(radiusFt) ? Math.ceil(radiusFt / FT_PER_SQUARE) : Math.max(cols(), rows());
  const x0 = centerOf(token.col), y0 = centerOf(token.row);
  const reachPx = (R + 1) * GRID;
  // Only walls near the token can matter.
  const near = state.gmOverride ? [] : blockingWalls().filter((w) =>
    Math.min(w.x1, w.x2) <= x0 + reachPx && Math.max(w.x1, w.x2) >= x0 - reachPx &&
    Math.min(w.y1, w.y2) <= y0 + reachPx && Math.max(w.y1, w.y2) >= y0 - reachPx);

  const cost = rule === 'circle' ? reachCircle(token, radiusFt, R, near)
    : rule === 'alternating' ? reachAlternating(token, radiusFt, near)
    : reachStandard(token, radiusFt, near);
  // A summoned thing cannot stray beyond its leash from the one who controls it.
  if (leashOwner) {
    for (const k of [...cost.keys()]) {
      const [c, r] = k.split(',').map(Number);
      if (Math.hypot(c - leashOwner.col, r - leashOwner.row) * FT_PER_SQUARE > token.summon.leashFt) cost.delete(k);
    }
  }
  // Allies may be passed through, but a move cannot end on an occupied square.
  for (const other of state.tokens) {
    if (other !== token) cost.delete(sqKey(other.col, other.row));
  }
  reachCache = { sig, map: cost };
  return cost;
}

/* =====================================================================
   TOKENS
   ===================================================================== */
const activeToken = () => state.tokens[state.activeIndex] || null;
const characterFor = (t) => (t?.characterId ? state.characters.find((c) => c.id === t.characterId) : null);

function makeToken({ id, name, color, characterId = null, isPC = true, col, row, speed = 30, image = '', hidden = false, kind = 'creature' }) {
  return { id, name, color, characterId, isPC, col, row, speed, image, hidden: Boolean(hidden), kind: kind === 'trap' ? 'trap' : 'creature', conditions: [], movementRemaining: speed };
}

// ---- Conditions and lasting effects on tokens ----
// A token's conditions are { name, rounds }; rounds is how many rounds are left (0 = until removed). The names below are the
// 5e conditions plus concentration; anything else is a short effect name such as "bless".
const CONDITIONS = {
  blinded: ['Bl', '#8e8e9a'], charmed: ['Ch', '#ff7ac8'], deafened: ['De', '#9a8e7a'], frightened: ['Fr', '#b06bff'],
  grappled: ['Gr', '#d98a3d'], incapacitated: ['In', '#cc5555'], invisible: ['Iv', '#6fd0e8'], paralyzed: ['Pa', '#e0c040'],
  petrified: ['Pe', '#9aa0a6'], poisoned: ['Po', '#4cc46a'], prone: ['Pr', '#c08a5a'], restrained: ['Re', '#d9a43d'],
  stunned: ['St', '#f0a040'], unconscious: ['Un', '#e05050'], exhaustion: ['Ex', '#a07850'], concentrating: ['Co', '#4f9dff']
};
const tokenConditions = (t) => (Array.isArray(t?.conditions) ? t.conditions.filter((c) => c && c.name) : []);
const conditionKey = (name) => String(name ?? '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 30);
const hasCondition = (t, name) => tokenConditions(t).some((c) => c.name === name);
const conditionBadge = (name) => CONDITIONS[name] || [name.slice(0, 2).toUpperCase(), '#4f9dff'];
// What each condition does (the 5e rules, shortened). The table applies the movement part itself; the rest is for the DM and the players.
const CONDITION_HELP = {
  blinded: "Can't see; fails checks that need sight. Attacks against it have advantage, its attacks have disadvantage.",
  charmed: "Can't attack the charmer or target it with harmful effects. The charmer has advantage on social checks against it.",
  deafened: "Can't hear; fails checks that need hearing.",
  frightened: "Disadvantage on checks and attacks while the source of fear is in sight; can't willingly move closer to it.",
  grappled: 'Speed 0. Ends if the grappler is incapacitated or it is moved out of reach.',
  incapacitated: "Can't take actions or reactions.",
  invisible: 'Cannot be seen without magic or special senses. Its attacks have advantage, attacks against it have disadvantage.',
  paralyzed: "Incapacitated, can't move or speak. Fails Str and Dex saves. Attacks against it have advantage; hits within 5 ft are critical.",
  petrified: "Turned to stone: incapacitated, can't move or speak, unaware. Resistant to all damage, immune to poison and disease.",
  poisoned: 'Disadvantage on attack rolls and ability checks.',
  prone: 'Can only crawl (half speed, here) or stand up (costs half its movement). Melee attacks against it have advantage, ranged have disadvantage; its attacks have disadvantage.',
  restrained: 'Speed 0. Attacks against it have advantage, its attacks and Dex saves have disadvantage.',
  stunned: "Incapacitated, can't move, speaks falteringly. Fails Str and Dex saves. Attacks against it have advantage.",
  unconscious: "Incapacitated, can't move or speak, unaware, drops what it holds and falls prone. Attacks against it have advantage; hits within 5 ft are critical.",
  exhaustion: 'Levels of exhaustion impose growing penalties; a long rest removes one level.',
  concentrating: 'Concentrating on a spell: a hit forces a Constitution save (DC 10 or half the damage) or the spell ends.'
};
const conditionHelp = (name) => CONDITION_HELP[name] || '';
// Speed lost to conditions: held, paralyzed, petrified, stunned or unconscious creatures cannot move; prone ones crawl.
function effectiveSpeed(t) {
  if (['grappled', 'restrained', 'paralyzed', 'petrified', 'stunned', 'unconscious'].some((n) => hasCondition(t, n))) return 0;
  return hasCondition(t, 'prone') ? Math.floor((t.speed || 0) / 2) : t.speed;
}
const conditionLabel = (c) => c.name + (c.rounds > 0 ? ` (${c.rounds} round${c.rounds === 1 ? '' : 's'})` : '');
// A blinded or unconscious character feels only their own square (1 ft); see revealFog().

function setCondition(t, name, rounds) {
  const key = conditionKey(name);
  if (!t || !key) return false;
  if (!Array.isArray(t.conditions)) t.conditions = [];
  const left = Number.isFinite(rounds) && rounds > 0 ? Math.min(Math.round(rounds), 999) : 0;
  const have = t.conditions.find((c) => c.name === key);
  if (have) have.rounds = left; else t.conditions.push({ name: key, rounds: left });
  if (t === activeToken() && Number.isFinite(t.movementRemaining)) t.movementRemaining = Math.min(t.movementRemaining, effectiveSpeed(t));
  return true;
}

function clearCondition(t, name) {
  const key = conditionKey(name);
  if (!t || !Array.isArray(t.conditions)) return false;
  const before = t.conditions.length;
  t.conditions = t.conditions.filter((c) => c.name !== key);
  return t.conditions.length !== before;
}

// At the start of a new round every timed condition loses a round; the ones that run out are removed.
function tickConditions() {
  let changed = false;
  for (const t of state.tokens) {
    for (const c of tokenConditions(t)) {
      if (!(c.rounds > 0)) continue;
      c.rounds -= 1;
      if (c.rounds <= 0) {
        clearCondition(t, c.name);
        if (seenByParty(t)) addChat('system', `↳ ${t.name} is no longer ${c.name}`);
        changed = true;
      }
    }
    if (t.summon && t.summon.rounds > 0) {
      t.summon.rounds -= 1;
      if (t.summon.rounds <= 0) {
        state.tokens.splice(state.tokens.indexOf(t), 1);
        addChat('system', `↳ ${t.name} fades away`);
        changed = true;
      }
    }
  }
  return changed;
}

// Summoned things a character controls (Mage Hand, Spiritual Weapon). They are tokens that move on their owner's turn, never have
// an initiative of their own, must stay within `leashFt` of their owner, and expire after `rounds` rounds.
const SUMMONS = {
  'mage-hand': { name: 'Mage Hand', speed: 30, rounds: 10, leashFt: 30, color: '#9ec1ff', glyph: '✋', note: 'Manipulates objects and carries up to 10 lb; cannot attack. Must stay within 30 ft of its caster.' },
  'spiritual-weapon': { name: 'Spiritual Weapon', speed: 20, rounds: 10, leashFt: 60, color: '#f0c048', glyph: '⚔', note: 'Moves up to 20 ft and attacks as a bonus action (cleric spell). Must stay within 60 ft of its caster.' }
};
const isSummon = (t) => Boolean(t && t.summon);
const summonsOf = (owner) => state.tokens.filter((t) => t.summon && t.summon.ownerId === owner.id);

function conjure(kind, owner, id, col, row) {
  const p = SUMMONS[kind];
  if (!p || !owner) return null;
  const spot = freeSquareNear(clamp(Number.isInteger(col) ? col : owner.col + 1, 0, cols() - 1), clamp(Number.isInteger(row) ? row : owner.row, 0, rows() - 1));
  const t = makeToken({ id: id || `summon-${kind}-${Date.now().toString(36)}`, name: `${owner.name}'s ${p.name}`, color: p.color, isPC: false, kind: 'creature', speed: p.speed, ...spot });
  t.summon = { kind, ownerId: owner.id, rounds: p.rounds, leashFt: p.leashFt };
  state.tokens.push(t);
  addChat('system', `↳ ${t.name} appears (${p.note})`);
  revealFog();
  commitBoard();
  return t;
}

// ---- What the players can see ----
// Player tokens are always shown. Anything else is hidden when it is marked hidden (invisible, hiding, an undiscovered trap),
// and, while fog of war is on, whenever it is outside the party's current line of sight.
function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

function seenByParty(t) {
  if (t.isPC) return true;
  if (t.hidden || hasCondition(t, 'invisible')) return false;
  if (!state.fogEnabled || state.gmOverride) return true;
  const x = centerOf(t.col), y = centerOf(t.row);
  return state.sight.some((s) => visibleFrom(s, x, y));
}
const canSee = (t) => seenByParty(t) || state.dmView;

// Token art cache: url -> HTMLImageElement (loads lazily, re-renders when ready).
const tokenArt = new Map();
function artFor(url) {
  if (!url) return null;
  let img = tokenArt.get(url);
  if (!img) {
    img = new Image();
    img.onload = () => requestRender();
    img.onerror = () => { img.failed = true; };
    img.src = url;
    tokenArt.set(url, img);
  }
  return img.complete && img.naturalWidth && !img.failed ? img : null;
}

function freeSquareNear(col, row) {
  const taken = new Set(state.tokens.map((t) => sqKey(t.col, t.row)));
  for (let radius = 0; radius < Math.max(cols(), rows()); radius++) {
    for (let dc = -radius; dc <= radius; dc++) {
      for (let dr = -radius; dr <= radius; dr++) {
        if (Math.max(Math.abs(dc), Math.abs(dr)) !== radius) continue;
        const c = col + dc, r = row + dr;
        if (inBounds(c, r) && !taken.has(sqKey(c, r))) return { col: c, row: r };
      }
    }
  }
  return { col: clamp(col, 0, cols() - 1), row: clamp(row, 0, rows() - 1) };
}

function createDefaultTokens() {
  state.tokens = [];
  const pcs = state.characters.slice(0, 4);
  for (let i = 0; i < 4; i++) {
    const [col, row] = START_SQUARES[i];
    const c = pcs[i];
    state.tokens.push(c
      ? makeToken({ id: `tok-${c.id}`, name: c.name, color: c.color, characterId: c.id, col, row, speed: c.speed, image: c.image || '' })
      : makeToken({ id: `tok-hero-${i + 1}`, name: DEFAULT_TOKENS[i].name, color: DEFAULT_TOKENS[i].color, col, row }));
  }
  state.activeIndex = 0;
}

function syncTokensWithCharacters() {
  const activeId = activeToken()?.id;
  state.tokens = state.tokens.filter((t) => !t.characterId || state.characters.some((c) => c.id === t.characterId));
  for (const t of state.tokens) {
    const c = characterFor(t);
    if (!c) continue;
    t.name = c.name;
    t.color = c.color;
    t.image = c.image || '';
    if (t.speed !== c.speed) {
      t.speed = c.speed;
      t.movementRemaining = Math.min(t.movementRemaining, c.speed);
    }
  }
  // Characters made on the Character Sheets page get a token the first time the tabletop sees them.
  for (const c of state.characters) {
    if (state.tokens.some((t) => t.characterId === c.id)) continue;
    const [col, row] = START_SQUARES[state.tokens.filter((t) => t.isPC).length % START_SQUARES.length];
    const spot = freeSquareNear(clamp(col, 0, cols() - 1), clamp(row, 0, rows() - 1));
    state.tokens.push(makeToken({ id: `tok-${c.id}`, name: c.name, color: c.color, characterId: c.id, col: spot.col, row: spot.row, speed: c.speed, image: c.image || '' }));
  }
  const idx = state.tokens.findIndex((t) => t.id === activeId);
  state.activeIndex = idx >= 0 ? idx : clamp(state.activeIndex, 0, Math.max(0, state.tokens.length - 1));
}

function clampTokensToMap() {
  for (const t of state.tokens) {
    t.col = clamp(t.col, 0, cols() - 1);
    t.row = clamp(t.row, 0, rows() - 1);
  }
}

function animateToken(t, fromX, fromY) {
  t._anim = { x: fromX, y: fromY, start: performance.now() };
  requestRender();
}

function tokenAt(wx, wy) {
  if (plainMap()) return null;
  for (let i = state.tokens.length - 1; i >= 0; i--) {
    const t = state.tokens[i];
    if (!canSee(t)) continue;
    if (Math.hypot(wx - centerOf(t.col), wy - centerOf(t.row)) <= GRID * 0.45) return t;
  }
  return null;
}

function doorAt(wx, wy) {
  const tolerance = Math.max(8, 10 / state.view.scale);
  let best = null, bestDist = Infinity;
  for (const w of state.walls) {
    if (w.type !== 'door') continue;
    const d = pointSegmentDistance(wx, wy, w);
    if (d < tolerance && d < bestDist) { best = w; bestDist = d; }
  }
  return best;
}

function endTurn() {
  if (!state.tokens.length) return;
  if (state.combat.active) { nextCombatTurn(); return; }
  // Creatures the party cannot see are skipped: the AI plays their turns in the narration.
  const was = state.activeIndex;
  for (let n = 0; n < state.tokens.length; n++) {
    state.activeIndex = (state.activeIndex + 1) % state.tokens.length;
    if (!isSummon(activeToken()) && seenByParty(activeToken())) break;
  }
  const next = activeToken();
  next.movementRemaining = effectiveSpeed(next);
  if (state.activeIndex <= was && tickConditions()) revealFog();     // the order came round: a new round
  toast(`${next.name}'s turn — ${next.speed} ft of movement`, 'ok');
  commitBoard();
}

function serializeToken(t) {
  return { id: t.id, name: t.name, col: t.col, row: t.row, color: t.color, isPC: t.isPC, characterId: t.characterId, speed: t.speed, movementRemaining: t.movementRemaining, image: t.image || '', hidden: Boolean(t.hidden), kind: t.kind === 'trap' ? 'trap' : 'creature', conditions: tokenConditions(t).map((c) => ({ name: c.name, rounds: c.rounds })),
    summon: t.summon || null, lightKind: t.lightKind || '', hp: t.hp, maxHp: t.maxHp, ac: t.ac, monster: t.monster || '', dexMod: t.dexMod, initiative: t.initiative, dead: Boolean(t.dead), stable: Boolean(t.stable), deathSaves: t.deathSaves || null, spent: t.spent || null };
}

/* =====================================================================
   FOG OF WAR (shroud + current-vision layers, destination-out)
   ===================================================================== */
const shroud = document.createElement('canvas');
const sctx = shroud.getContext('2d');
const vision = document.createElement('canvas');
const vctx = vision.getContext('2d');
let fogSaveTimer = null;

function resetShroud() {
  for (const [c, cx] of [[shroud, sctx], [vision, vctx]]) {
    c.width = state.map.width;
    c.height = state.map.height;
    cx.globalCompositeOperation = 'source-over';
  }
  sctx.fillStyle = '#040508';
  sctx.fillRect(0, 0, shroud.width, shroud.height);
}

// Small closed wall loops (tents, boulders, crates, tree trunks) are objects you see the top of: see public/wallobjects.js. Cached until the walls change.
let objectCache = { version: -1, loops: [] };
function objectLoops() {
  if (objectCache.version === state.wallsVersion) return objectCache.loops;
  objectCache = { version: state.wallsVersion, loops: WallObjects.loops(state.walls, 9 * GRID) };
  return objectCache.loops;
}

// After the fog is cut for what each party member sees: reveal the top of any small object whose edge someone can see.
function revealObjectTops() {
  if (!state.sight.length) return;
  for (const loop of objectLoops()) {
    const points = WallObjects.samples(loop, 14);
    const seers = state.sight.filter((s) => points.some((p) => visibleFrom(s, p.x, p.y)));
    if (!seers.length) continue;
    // In the dark (or for the blind) only the part of the top that is lit, or within reach, shows; otherwise the whole top does.
    const partial = ambientNow() === 'dark' || seers.some((s) => s.feel);
    if (partial) {
      const W = state.map.width, H = state.map.height;
      for (const s of seers) {
        drawSightShape(s, loop);
        for (const c of [sctx, vctx]) { c.save(); c.globalCompositeOperation = 'destination-out'; c.drawImage(sightTmp, 0, 0, W, H); c.restore(); }
      }
      continue;
    }
    for (const c of [sctx, vctx]) {
      c.save();
      c.globalCompositeOperation = 'destination-out';
      c.fillStyle = '#000';
      c.beginPath();
      c.moveTo(loop[0].x, loop[0].y);
      for (let i = 1; i < loop.length; i++) c.lineTo(loop[i].x, loop[i].y);
      c.closePath();
      c.fill();
      c.restore();
    }
  }
}

function revealFog() {
  // With fog off the whole map is shown and nothing is remembered as explored. Turning fog on later starts from what the party sees then.
  if (!state.fogEnabled) {
    state.sight = [];
    renderTurnBar();
    requestRender();
    return;
  }
  const W = state.map.width, H = state.map.height;
  vctx.globalCompositeOperation = 'source-over';
  vctx.clearRect(0, 0, W, H);
  vctx.fillStyle = 'rgba(4, 5, 8, 0.55)';
  vctx.fillRect(0, 0, W, H);
  state.sight = [];
  const dark = ambientNow() === 'dark';
  let needCanvases = dark;
  const members = [];
  for (const t of state.tokens) {
    if (!t.isPC) continue;
    const cx = centerOf(t.col), cy = centerOf(t.row);
    const poly = visibilityPolygon(cx, cy);
    if (poly.length < 3) continue;
    const c = characterFor(t);
    const feel = hasCondition(t, 'blinded') || hasCondition(t, 'unconscious') ? feetToPx(1) : 0;
    const s = { cx, cy, poly, dv: feetToPx((c && c.darkvision) || 0), feel };
    if (feel) needCanvases = true;
    members.push(s);
    state.sight.push(s);
  }
  if (needCanvases) { sizeLightCanvases(W, H); if (dark) buildLitMask(); }
  for (const s of members) {
    // Bright or dim light: line of sight is all it takes. Darkness (or blindness): only what is lit, or the darkvision / touch range.
    const simple = !dark && !s.feel;
    if (!simple) drawSightShape(s);
    for (const c of [sctx, vctx]) {
      c.save();
      c.globalCompositeOperation = 'destination-out';
      if (simple) {
        c.fillStyle = '#000';
        c.beginPath();
        c.moveTo(s.poly[0].x, s.poly[0].y);
        for (let i = 1; i < s.poly.length; i++) c.lineTo(s.poly[i].x, s.poly[i].y);
        c.closePath();
        c.fill();
      } else {
        c.drawImage(sightTmp, 0, 0, W, H);
      }
      c.restore();
    }
  }
  revealObjectTops();
  scheduleFogSave();
  renderTurnBar();
  requestRender();
}

function scheduleFogSave() {
  clearTimeout(fogSaveTimer);
  const key = fogKey();
  fogSaveTimer = setTimeout(() => {
    try {
      if (!store.setRaw(key, shroud.toDataURL('image/png'))) console.info('Fog not persisted (storage full or unavailable)');
    } catch (err) {
      console.info('Fog not persisted:', err.message);
    }
  }, 700);
}

function loadFog() {
  return new Promise((resolve) => {
    const data = store.getRaw(fogKey());
    if (!data) { revealFog(); resolve(); return; }
    const img = new Image();
    img.onload = () => {
      if (img.naturalWidth === shroud.width && img.naturalHeight === shroud.height) {
        sctx.globalCompositeOperation = 'source-over';
        sctx.clearRect(0, 0, shroud.width, shroud.height);
        sctx.drawImage(img, 0, 0);
      }
      revealFog();
      resolve();
    };
    img.onerror = () => { revealFog(); resolve(); };
    img.src = data;
  });
}

function resetFog() {
  store.remove(fogKey());
  resetShroud();
  revealFog();
  toast('Explored fog reset');
}

/* =====================================================================
   MAP LOADING
   ===================================================================== */
function setMap(url) {
  return new Promise((resolve) => {
    if (!url) {
      state.map = { url: null, img: null, width: DEFAULT_COLS * GRID, height: DEFAULT_ROWS * GRID, drawW: 0, drawH: 0 };
      onMapChanged().then(resolve);
      return;
    }
    const img = new Image();
    img.onload = async () => {
      // A map calibrated on the Map Test page is scaled so one printed square is one board square; otherwise small
      // images are scaled up so the map is at least 12 squares on its short side.
      let squares = null;
      try {
        const res = await fetch('/api/map-config?map=' + encodeURIComponent(url.split('/').pop()));
        const c = res.ok ? (await res.json()).config : null;
        if (c && c.squares >= 5 && c.squares <= 400) squares = c.squares;
      } catch { /* no calibration: use the natural size */ }
      const factor = squares ? (squares * GRID) / img.naturalWidth : Math.max(1, (12 * GRID) / Math.min(img.naturalWidth, img.naturalHeight));
      const drawW = img.naturalWidth * factor;
      const drawH = img.naturalHeight * factor;
      state.map = { url, img, width: Math.ceil(drawW / GRID) * GRID, height: Math.ceil(drawH / GRID) * GRID, drawW, drawH };
      onMapChanged().then(resolve);
    };
    img.onerror = () => {
      toast('Could not load that map image — using the default grid', 'error');
      setMap(null).then(resolve);
    };
    img.src = url;
  });
}

// Move the table to another map: remember the scene being left (its creatures and where the party stood),
// show the new map, and put the party at the arrival spot (or where they last stood there). Used by the AI's changeMap and by the picker.
async function travelTo(u) {
  if (!u || !u.mapUrl || u.mapUrl === state.map.url) return;
  const from = state.map.url || 'default';
  state.mapMemory[from] = {
    npcs: state.tokens.filter((t) => !t.isPC).map(serializeToken),
    party: Object.fromEntries(state.tokens.filter((t) => t.isPC).map((t) => [t.id, { col: t.col, row: t.row }]))
  };
  if (!noFogMap() && u.kind !== 'battle') state.fogBeforeOverland = state.fogEnabled;
  // The party is still standing where it was on the old map while the new one loads: no fog is cut for them until they are placed.
  const fogWas = state.fogEnabled;
  state.fogEnabled = false;
  await setMap(u.mapUrl);
  state.fogEnabled = fogWas;
  state.mapKind = u.kind === 'regional' || u.kind === 'town' || u.kind === 'camp' ? u.kind : 'battle';
  // An arrival spot saved on the Map Test page is in image pixels; turn it into a board square at this map's scale.
  if (u.px && state.map.img) {
    const f = state.map.drawW / state.map.img.naturalWidth;
    u = { ...u, col: Math.floor(u.px.x * f / GRID), row: Math.floor(u.px.y * f / GRID) };
  }
  const memory = state.mapMemory[u.mapUrl];
  const party = state.tokens.filter((t) => t.isPC);
  state.tokens = [...party];                              // creatures belong to the scene they were in (a copy: `party` must stay just the party)
  if (memory) for (const t of memory.npcs) state.tokens.push({ ...t });
  party.forEach((t) => { t.col = -100; t.row = -100; });  // out of the way while each is placed
  for (const t of party) {
    // A named arrival spot (the front door, the alley) wins; otherwise the party goes back where they last stood on that map.
    const was = !u.explicit && memory && memory.party[t.id];
    const spot = was && inBounds(was.col, was.row) ? { col: was.col, row: was.row } : freeSquareNear(clamp(u.col, 0, cols() - 1), clamp(u.row, 0, rows() - 1));
    t.col = spot.col;
    t.row = spot.row;
    t.movementRemaining = t.speed;
  }
  if (plainMap()) {
    state.gridOpacity = 0;
    state.fogEnabled = false;
  } else {
    state.gridOpacity = 0.35;
    if (state.mapKind === 'camp') state.fogEnabled = false;
    else if (state.fogBeforeOverland !== null) { state.fogEnabled = state.fogBeforeOverland; state.fogBeforeOverland = null; }
  }
  state.zoomToParty = !plainMap() && cols() > 45;
  $('#fogToggle').checked = state.fogEnabled;
  syncMapUi();
  state.activeIndex = 0;
  revealFog();
  focusStart();
  commitBoard();
  syncMapPick();
  addChat('system', `↳ The party arrives at ${u.mapName || 'a new map'}`);
}

// Controls that make no sense on a regional map are switched off while one is showing.
function syncMapUi() {
  const regional = noFogMap();
  const plain = plainMap();
  $('#fogToggle').disabled = regional;
  $('#resetFogBtn').disabled = regional;
  $('#moveRule').disabled = plain;
  const why = plain ? 'Not used on a regional or town map' : 'No fog of war on a camp map';
  $('#fogToggle').parentElement.title = regional ? why : "Fog of war: only what the party can see from where they stand is shown, and explored areas are remembered. Enemies outside the party's sight are hidden.";
  $('#resetFogBtn').title = regional ? why : 'Cover the whole map in fog again. Explored areas are forgotten.';
  $('#moveRule').parentElement.title = plain ? why : 'How far a token can move. Standard 5e counts a diagonal step as 5 ft, which makes a square. The others are variants.';
}

// The maps this campaign can move to, offered in the top bar.
async function loadPlaces() {
  try {
    state.places = (await api('/api/maps/available')).maps || [];
  } catch { state.places = []; }
  const sel = $('#mapPick');
  sel.innerHTML = '';
  for (const p of state.places) {
    const o = document.createElement('option');
    o.value = p.url;
    o.textContent = p.name;
    sel.appendChild(o);
  }
  $('#mapPickBox').hidden = !state.places.length;
  syncMapPick();
}

function syncMapPick() {
  const sel = $('#mapPick');
  if (state.places.some((p) => p.url === state.map.url)) sel.value = state.map.url;
  else if (state.places.length) sel.selectedIndex = -1;
}

// Walls saved for this map on the server (data/maps/, made on the Map Test page), converted from image pixels to board pixels.
async function serverWalls() {
  if (!state.map.url || !state.map.img) return [];
  try {
    const res = await fetch('/api/map-config?map=' + encodeURIComponent(state.map.url.split('/').pop()));
    if (!res.ok) return [];
    const { config } = await res.json();
    if (!config || !Array.isArray(config.walls)) return [];
    state.wallsInPicture = config.source === 'dd2vtt';        // the picture already shows its own walls: only doors are marked on top
    const f = state.map.drawW / state.map.img.naturalWidth;
    return config.walls.map((w) => ({
      x1: w.x1 * f, y1: w.y1 * f, x2: w.x2 * f, y2: w.y2 * f, type: w.type === 'door' ? 'door' : 'wall', open: Boolean(w.open)
    }));
  } catch {
    return [];
  }
}

async function onMapChanged() {
  state.wallsInPicture = false;
  await loadMapLighting();
  state.walls = store.get(wallsKey(), []);
  if (!Array.isArray(state.walls)) state.walls = [];
  syncAmbience();
  if (!state.walls.length) state.walls = await serverWalls();
  state.wallsVersion++;
  clampTokensToMap();
  resetShroud();
  fitView();
  await loadFog();
  commitBoard();
}

/* =====================================================================
   WALLS
   ===================================================================== */
function snapToCorner(x, y) {
  return {
    x: clamp(Math.round(x / GRID) * GRID, 0, state.map.width),
    y: clamp(Math.round(y / GRID) * GRID, 0, state.map.height)
  };
}

function wallsChanged() {
  state.wallsVersion++;
  store.set(wallsKey(), state.walls);
  revealFog();
  renderTurnBar();
}

/* =====================================================================
   RENDERING
   ===================================================================== */
let renderQueued = false;
let animating = false;

function requestRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(render);
}

function render(now) {
  renderQueued = false;
  animating = false;
  const v = state.view;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07090d';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * v.scale, 0, 0, dpr * v.scale, dpr * v.ox, dpr * v.oy);

  drawBackground();
  drawGrid();
  drawWallSegments(1);
  drawTokens(false, now);
  drawFog();
  if (state.drawWalls || state.gmOverride) drawWallSegments(0.85);
  drawReachable();
  drawTokens(true, now);
  drawDragPreview();
  drawWallPreview();

  if (animating) requestRender();
}

function drawBackground() {
  const { width, height, img, drawW, drawH } = state.map;
  ctx.fillStyle = '#2c313a';
  ctx.fillRect(0, 0, width, height);
  if (img) {
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, drawW, drawH);
    drawFlickeringLights();
  }
}

// Fires and torches marked "flicker" in the map config are animated over the picture (not when put out).
function flickerLights() {
  const off = state.lightsOff[state.map.url || ''] || [];
  return state.lights.filter((l) => l.flicker && !off.includes(l.id));
}
function drawFlickeringLights() {
  const t = performance.now() / 1000;
  for (const L of flickerLights()) Flicker.draw(ctx, L.x, L.y, GRID * Math.min(1, Math.max(0.25, Math.pow(L.dim / GRID / 9, 2))), t);     // a torch burns smaller than a campfire
}
setInterval(() => { if (document.visibilityState === 'visible' && !plainMap() && flickerLights().length) requestRender(); }, 66);

function drawGrid() {
  const { width, height } = state.map;
  if (state.gridOpacity <= 0) return;
  ctx.save();
  ctx.lineWidth = 1 / state.view.scale;
  ctx.strokeStyle = `rgba(255, 255, 255, ${state.gridOpacity})`;
  ctx.beginPath();
  for (let x = 0; x <= width; x += GRID) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
  for (let y = 0; y <= height; y += GRID) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
  ctx.stroke();
  ctx.lineWidth = 2 / state.view.scale;
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.strokeRect(0, 0, width, height);
  ctx.restore();
}

function drawWallSegments(alpha) {
  if (!state.walls.length) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  for (const w of state.walls) {
    const isDoor = w.type === 'door';
    if (state.wallsInPicture && !isDoor && !state.drawWalls && !state.gmOverride) continue;
    ctx.setLineDash(isDoor && w.open ? [10, 8] : []);
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.strokeStyle = isDoor ? (w.open ? 'rgba(213, 140, 63, 0.75)' : '#d58c3f') : '#c7ccd6';
    ctx.beginPath(); ctx.moveTo(w.x1, w.y1); ctx.lineTo(w.x2, w.y2); ctx.stroke();
  }
  ctx.setLineDash([]);
  if (state.drawWalls) {
    ctx.fillStyle = '#ff6b6b';
    for (const w of state.walls) {
      ctx.beginPath(); ctx.arc(w.x1, w.y1, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(w.x2, w.y2, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFog() {
  if (!state.fogEnabled) return;
  ctx.save();
  ctx.globalAlpha = state.gmOverride ? 0.5 : 1;
  ctx.drawImage(shroud, 0, 0);
  ctx.globalAlpha = state.gmOverride ? 0.5 : 1;
  ctx.drawImage(vision, 0, 0);
  ctx.restore();
}

function drawReachable() {
  const t = interaction.mode === 'drag' && interaction.token && isSummon(interaction.token) ? interaction.token : activeToken();
  if (!t || state.drawWalls || state.gmOverride || plainMap()) return;
  const reach = reachable(t);
  const set = new Set(reach.keys());
  set.add(sqKey(t.col, t.row));
  ctx.save();
  ctx.fillStyle = 'rgba(240, 192, 72, 0.10)';
  for (const k of set) {
    const [c, r] = k.split(',').map(Number);
    ctx.fillRect(c * GRID, r * GRID, GRID, GRID);
  }
  ctx.strokeStyle = 'rgba(240, 192, 72, 0.85)';
  ctx.lineWidth = 2 / state.view.scale;
  ctx.setLineDash([6 / state.view.scale, 4 / state.view.scale]);
  ctx.beginPath();
  if (state.moveRule === 'circle') {
    // Round rule: the true circle at the movement radius.
    ctx.arc(centerOf(t.col), centerOf(t.row), (t.movementRemaining / FT_PER_SQUARE) * GRID, 0, Math.PI * 2);
  } else {
    // Boundary outline: edges whose neighbour is outside the reachable set.
    for (const k of set) {
      const [c, r] = k.split(',').map(Number);
      const x = c * GRID, y = r * GRID;
      if (!set.has(sqKey(c, r - 1))) { ctx.moveTo(x, y); ctx.lineTo(x + GRID, y); }
      if (!set.has(sqKey(c, r + 1))) { ctx.moveTo(x, y + GRID); ctx.lineTo(x + GRID, y + GRID); }
      if (!set.has(sqKey(c - 1, r))) { ctx.moveTo(x, y); ctx.lineTo(x, y + GRID); }
      if (!set.has(sqKey(c + 1, r))) { ctx.moveTo(x + GRID, y); ctx.lineTo(x + GRID, y + GRID); }
    }
  }
  ctx.stroke();
  ctx.restore();
}

function tokenDisplayPos(t, now) {
  if (interaction.mode === 'drag' && interaction.token === t) {
    return { x: interaction.wx - interaction.offX, y: interaction.wy - interaction.offY };
  }
  const tx = centerOf(t.col), ty = centerOf(t.row);
  if (t._anim) {
    const p = Math.min(1, (now - t._anim.start) / 180);
    if (p >= 1) { t._anim = null; return { x: tx, y: ty }; }
    animating = true;
    const e = 1 - Math.pow(1 - p, 3);
    return { x: t._anim.x + (tx - t._anim.x) * e, y: t._anim.y + (ty - t._anim.y) * e };
  }
  return { x: tx, y: ty };
}

function drawTokens(pcs, now) {
  if (plainMap()) return;          // regional and town maps are just maps: no tokens on them
  const active = activeToken();
  const radius = GRID * 0.4;
  const ordered = state.tokens.filter((t) => (pcs ? (t.isPC || (state.dmView && !seenByParty(t))) : (!t.isPC && seenByParty(t))));
  // Draw the dragged token last so it floats above the others.
  ordered.sort((a, b) => (a === interaction.token) - (b === interaction.token));
  for (const t of ordered) {
    const { x, y } = tokenDisplayPos(t, now);
    const isActive = t === active;
    const dragging = interaction.mode === 'drag' && interaction.token === t;
    const ghost = !t.isPC && !seenByParty(t);
    const glyph = t.kind === 'trap' ? '⚠' : isSummon(t) ? (SUMMONS[t.summon.kind] || {}).glyph || '✦' : initials(t.name);
    ctx.save();
    if (ghost || t.dead) ctx.globalAlpha = t.dead ? 0.4 : 0.45;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
    ctx.shadowBlur = dragging ? 18 : 8;
    ctx.shadowOffsetY = dragging ? 6 : 2;
    if (isActive) {
      ctx.beginPath();
      ctx.arc(x, y, radius + 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(240, 192, 72, 0.35)';
      ctx.fill();
    }
    const art = artFor(t.image);
    const r = radius * (dragging ? 1.08 : 1);
    if (art) {
      // The supplied token PNGs are already round with their own frame; draw them whole.
      const size = (r + 4) * 2;
      ctx.drawImage(art, x - size / 2, y - size / 2, size, size);
      ctx.shadowColor = 'transparent';
      if (isActive || !t.isPC) {
        ctx.beginPath();
        ctx.arc(x, y, size / 2 - 1, 0, Math.PI * 2);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = isActive ? '#f0c048' : '#ff6b6b';
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = t.color || '#888';
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 3;
      ctx.strokeStyle = isActive ? '#f0c048' : (t.isPC ? '#ffffff' : '#ff6b6b');
      if (!t.isPC) ctx.setLineDash([5, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ffffff';
      ctx.font = `800 ${Math.round(GRID * 0.3)}px Inter, "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.strokeText(glyph, x, y + 1);
      ctx.fillText(glyph, x, y + 1);
    }

    const hpMax = maxHpOf(t), hpNow = hpOf(t);
    if (hpMax > 0 && (t.isPC || hpNow < hpMax)) {
      const bw = GRID * 0.8, bh = 5, bx = x - bw / 2, by = y + radius + 4;
      const pct = clamp(hpNow / hpMax, 0, 1);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = pct > 0.5 ? '#3fd27f' : pct > 0.25 ? '#f0c048' : '#ff6b6b';
      ctx.fillRect(bx, by, bw * pct, bh);
    }
    if (t.dead) {
      ctx.strokeStyle = 'rgba(255, 90, 90, 0.95)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - radius * 0.7, y - radius * 0.7); ctx.lineTo(x + radius * 0.7, y + radius * 0.7);
      ctx.moveTo(x + radius * 0.7, y - radius * 0.7); ctx.lineTo(x - radius * 0.7, y + radius * 0.7);
      ctx.stroke();
    }
    const conds = tokenConditions(t);
    if (conds.length) {
      // Condition badges sit along the top of the token: two letters each, colour by condition.
      const cr = Math.max(7, GRID * 0.14);
      conds.slice(0, 4).forEach((c, i) => {
        const [abbr, color] = conditionBadge(c.name);
        const bx = x - radius + cr + i * (cr * 2 + 2), by = y - radius - cr - 1;
        ctx.beginPath();
        ctx.arc(bx, by, cr, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = `800 ${Math.round(cr * 0.95)}px Inter, "Segoe UI", system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(abbr, bx, by + 0.5);
      });
      if (conds.length > 4) {
        ctx.fillStyle = '#ffffff';
        ctx.font = `800 ${Math.round(cr)}px Inter, "Segoe UI", system-ui, sans-serif`;
        ctx.textAlign = 'left';
        ctx.fillText(`+${conds.length - 4}`, x - radius + 4 * (cr * 2 + 2), y - radius - cr - 1);
      }
    }
    if (state.view.scale > 0.45 || isActive) {
      ctx.font = `700 ${Math.round(GRID * 0.22)}px Inter, "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = ghost ? `${t.name} (${t.hidden ? (t.kind === 'trap' ? 'hidden trap' : 'hidden') : 'out of sight'})` : t.name;
      const tw = ctx.measureText(label).width + 10;
      const ly = y - radius - 11;
      ctx.fillStyle = 'rgba(7, 9, 13, 0.85)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x - tw / 2, ly - 8, tw, 16, 8); else ctx.rect(x - tw / 2, ly - 8, tw, 16);
      ctx.fill();
      ctx.fillStyle = isActive ? '#f0c048' : '#edf1f7';
      ctx.fillText(label, x, ly + 1);
    }
    ctx.restore();
  }
}

function dragTarget() {
  const t = interaction.token;
  const x = interaction.wx - interaction.offX;
  const y = interaction.wy - interaction.offY;
  const { col, row } = worldToCell(x, y);
  const cell = { col: clamp(col, 0, cols() - 1), row: clamp(row, 0, rows() - 1) };
  const same = cell.col === t.col && cell.row === t.row;
  const cost = reachable(t).get(sqKey(cell.col, cell.row));
  return { ...cell, same, cost, legal: same || cost !== undefined };
}

function drawDragPreview() {
  if (interaction.mode !== 'drag' || !interaction.token) return;
  const t = interaction.token;
  const target = dragTarget();
  const s = state.view.scale;
  ctx.save();
  ctx.fillStyle = target.legal ? 'rgba(63, 210, 127, 0.28)' : 'rgba(255, 107, 107, 0.30)';
  ctx.strokeStyle = target.legal ? '#3fd27f' : '#ff6b6b';
  ctx.lineWidth = 2 / s;
  ctx.fillRect(target.col * GRID, target.row * GRID, GRID, GRID);
  ctx.strokeRect(target.col * GRID, target.row * GRID, GRID, GRID);
  ctx.setLineDash([6 / s, 5 / s]);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.beginPath();
  ctx.moveTo(centerOf(t.col), centerOf(t.row));
  ctx.lineTo(centerOf(target.col), centerOf(target.row));
  ctx.stroke();
  ctx.setLineDash([]);
  const label = target.same ? '0 ft'
    : target.legal ? (state.gmOverride ? 'GM move' : `${Math.round(target.cost)} ft`)
    : 'Out of range';
  ctx.font = `700 ${14 / s}px Inter, "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lx = centerOf(target.col), ly = target.row * GRID - 14 / s;
  const tw = ctx.measureText(label).width + 14 / s;
  ctx.fillStyle = 'rgba(7, 9, 13, 0.9)';
  ctx.fillRect(lx - tw / 2, ly - 11 / s, tw, 22 / s);
  ctx.fillStyle = target.legal ? '#3fd27f' : '#ff6b6b';
  ctx.fillText(label, lx, ly);
  ctx.restore();
}

function drawWallPreview() {
  if (interaction.mode !== 'wall' || !interaction.wallStart || !interaction.wallEnd) return;
  const a = interaction.wallStart, b = interaction.wallEnd;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = 6;
  ctx.strokeStyle = state.wallType === 'door' ? 'rgba(213, 140, 63, 0.9)' : 'rgba(255, 107, 107, 0.9)';
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.fillStyle = '#ffffff';
  for (const p of [a, b]) { ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); }
  const lenFt = Math.round((Math.hypot(b.x - a.x, b.y - a.y) / GRID) * FT_PER_SQUARE);
  ctx.font = `700 ${13 / state.view.scale}px Inter, system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${lenFt} ft`, (a.x + b.x) / 2, (a.y + b.y) / 2 - 10 / state.view.scale);
  ctx.restore();
}

/* =====================================================================
   POINTER / TOUCH INPUT
   ===================================================================== */
function updateCursor(world) {
  if (interaction.mode === 'drag') { canvas.style.cursor = 'grabbing'; return; }
  if (interaction.mode === 'pan' || interaction.mode === 'pinch') { canvas.style.cursor = 'move'; return; }
  if (state.drawWalls) { canvas.style.cursor = 'crosshair'; return; }
  const t = world && tokenAt(world.x, world.y);
  if (t && (t === activeToken() || state.gmOverride)) canvas.style.cursor = 'grab';
  else if (world && doorAt(world.x, world.y)) canvas.style.cursor = 'pointer';
  else canvas.style.cursor = 'default';
}

function startPinch() {
  const [p1, p2] = [...interaction.pointers.values()];
  const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
  interaction.pinch = {
    dist: Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1,
    world: screenToWorld(mid.x, mid.y),
    scale: state.view.scale
  };
  interaction.mode = 'pinch';
}

function cancelInteraction() {
  if (interaction.mode === 'drag' && interaction.token) {
    const t = interaction.token;
    animateToken(t, interaction.wx - interaction.offX, interaction.wy - interaction.offY);
  }
  interaction.mode = null;
  interaction.token = null;
  interaction.wallStart = null;
  interaction.wallEnd = null;
  interaction.pinch = null;
  requestRender();
}

canvas.addEventListener('pointerdown', (e) => {
  const pos = eventPos(e);
  interaction.pointers.set(e.pointerId, pos);
  canvas.setPointerCapture(e.pointerId);

  if (interaction.pointers.size === 2) {
    // Second finger: abandon any single-pointer action and pinch-zoom instead.
    if (interaction.mode === 'drag' || interaction.mode === 'wall') cancelInteraction();
    startPinch();
    return;
  }
  if (interaction.pointers.size > 2) return;

  const world = screenToWorld(pos.x, pos.y);
  const isPanButton = e.button === 1 || e.button === 2;

  if (state.drawWalls && e.button === 0) {
    interaction.mode = 'wall';
    interaction.wallStart = snapToCorner(world.x, world.y);
    interaction.wallEnd = { ...interaction.wallStart };
    requestRender();
    return;
  }
  if (state.drawWalls && e.button === 2) return; // handled by contextmenu (undo)

  if (!isPanButton) {
    const t = tokenAt(world.x, world.y);
    if (t) {
      const own = isSummon(t) && activeToken() && t.summon.ownerId === activeToken().id;        // a summoned thing moves on its owner's turn
      if (t !== activeToken() && !own && !state.gmOverride) {
        toast(`It's ${activeToken()?.name ?? 'someone else'}'s turn. Use End Turn or GM Override.`);
        return;
      }
      if (state.gmOverride && t !== activeToken() && !own) {
        state.activeIndex = state.tokens.indexOf(t);
        renderTurnBar();
      }
      interaction.mode = 'drag';
      interaction.token = t;
      interaction.wx = world.x;
      interaction.wy = world.y;
      interaction.offX = world.x - centerOf(t.col);
      interaction.offY = world.y - centerOf(t.row);
      t._anim = null;
      updateCursor(world);
      requestRender();
      return;
    }
    const door = doorAt(world.x, world.y);
    if (door) {
      door.open = !door.open;
      wallsChanged();
      toast(door.open ? 'Door opened' : 'Door closed');
      return;
    }
  }
  interaction.mode = 'pan';
  interaction.panStart = { x: pos.x, y: pos.y, ox: state.view.ox, oy: state.view.oy };
  updateCursor(world);
});

canvas.addEventListener('pointermove', (e) => {
  const pos = eventPos(e);
  if (interaction.pointers.has(e.pointerId)) interaction.pointers.set(e.pointerId, pos);
  const world = screenToWorld(pos.x, pos.y);

  const cell = worldToCell(world.x, world.y);
  const hover = inBounds(cell.col, cell.row) ? cell : null;
  if (hover?.col !== interaction.hoverSquare?.col || hover?.row !== interaction.hoverSquare?.row) {
    interaction.hoverSquare = hover;
    updateHud();
  }

  switch (interaction.mode) {
    case 'drag':
      interaction.wx = world.x;
      interaction.wy = world.y;
      requestRender();
      break;
    case 'wall':
      interaction.wallEnd = snapToCorner(world.x, world.y);
      requestRender();
      break;
    case 'pan': {
      const p = interaction.panStart;
      state.view.ox = p.ox + (pos.x - p.x);
      state.view.oy = p.oy + (pos.y - p.y);
      requestRender();
      break;
    }
    case 'pinch': {
      if (interaction.pointers.size < 2) break;
      const [p1, p2] = [...interaction.pointers.values()];
      const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const d = Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1;
      const pz = interaction.pinch;
      state.view.scale = clamp(pz.scale * (d / pz.dist), MIN_SCALE, MAX_SCALE);
      state.view.ox = mid.x - pz.world.x * state.view.scale;
      state.view.oy = mid.y - pz.world.y * state.view.scale;
      updateHud();
      requestRender();
      break;
    }
    default:
      updateCursor(world);
  }
});

function finishPointer(e, cancelled) {
  if (!interaction.pointers.has(e.pointerId)) return;
  interaction.pointers.delete(e.pointerId);
  if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);

  if (interaction.mode === 'pinch') {
    if (interaction.pointers.size === 0) interaction.mode = null;
    else if (interaction.pointers.size === 1) {
      const [p] = [...interaction.pointers.values()];
      interaction.mode = 'pan';
      interaction.panStart = { x: p.x, y: p.y, ox: state.view.ox, oy: state.view.oy };
    }
    return;
  }

  if (interaction.mode === 'drag') {
    if (cancelled) { cancelInteraction(); return; }
    const t = interaction.token;
    const target = dragTarget();
    const fromX = interaction.wx - interaction.offX;
    const fromY = interaction.wy - interaction.offY;
    interaction.mode = null;
    interaction.token = null;
    if (target.same) {
      animateToken(t, fromX, fromY);
    } else if (target.legal) {
      t.col = target.col;
      t.row = target.row;
      if (!state.gmOverride) t.movementRemaining = Math.max(0, t.movementRemaining - Math.min(t.movementRemaining, Math.round(target.cost)));
      animateToken(t, fromX, fromY);
      revealFog();
      commitBoard();
    } else {
      animateToken(t, fromX, fromY);
      toast(`Too far — ${t.name} has ${t.movementRemaining} ft left (walls block movement)`, 'error');
    }
    updateCursor(screenToWorld(eventPos(e).x, eventPos(e).y));
    return;
  }

  if (interaction.mode === 'wall') {
    const a = interaction.wallStart, b = interaction.wallEnd;
    interaction.mode = null;
    interaction.wallStart = null;
    interaction.wallEnd = null;
    if (!cancelled && a && b && (a.x !== b.x || a.y !== b.y)) {
      state.walls.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, type: state.wallType, open: false });
      wallsChanged();
    }
    requestRender();
    return;
  }

  interaction.mode = null;
  updateCursor(null);
}

canvas.addEventListener('pointerup', (e) => finishPointer(e, false));
canvas.addEventListener('pointercancel', (e) => finishPointer(e, true));

/* =====================================================================
   LIGHTING: ambient light, light sources (map lights and lights tokens carry), darkvision
   ===================================================================== */
// A place is bright (daylight), dim (a lit room, dusk) or dark. In the dark a character sees only what a light source lights
// (bright light out to the bright radius, dim light out to the dim radius) or what their darkvision reaches; darkvision turns
// dark into dim. In bright or dim light, line of sight is all it takes.
const LIGHT_KINDS = { torch: [20, 40, 'Torch'], lantern: [30, 60, 'Lantern'], candle: [5, 10, 'Candle'], light: [20, 40, 'Light spell'] };
const ambientNow = () => state.ambientOverride || state.ambient;
const feetToPx = (ft) => (ft / FT_PER_SQUARE) * GRID;

// Lights that are on: the map's own (campfire, wall torches) and the ones tokens carry. Sizes in board pixels.
function allLights() {
  const out = [];
  const off = state.lightsOff[state.map.url || ''] || [];
  for (const l of state.lights) if (!off.includes(l.id)) out.push(l);
  for (const t of state.tokens) {
    const k = LIGHT_KINDS[t.lightKind];
    if (k && !t.dead) out.push({ id: `token-${t.id}`, name: `${t.name}'s ${k[2].toLowerCase()}`, x: centerOf(t.col), y: centerOf(t.row), bright: feetToPx(k[0]), dim: feetToPx(k[1]) });
  }
  return out;
}

let lightPolyCache = { version: -1, map: new Map() };
function lightPoly(L) {
  if (lightPolyCache.version !== state.wallsVersion) lightPolyCache = { version: state.wallsVersion, map: new Map() };
  const key = `${Math.round(L.x)},${Math.round(L.y)}`;
  let poly = lightPolyCache.map.get(key);
  if (!poly) { poly = visibilityPolygon(L.x, L.y); lightPolyCache.map.set(key, poly); }
  return poly;
}

// 0 dark, 1 dim, 2 bright at a board point.
function lightLevelAt(x, y) {
  const amb = ambientNow();
  if (amb !== 'dark') return amb === 'bright' ? 2 : 1;
  let best = 0;
  for (const L of allLights()) {
    const d = Math.hypot(x - L.x, y - L.y);
    if (d > L.dim || !pointInPolygon(x, y, lightPoly(L))) continue;
    best = Math.max(best, d <= L.bright ? 2 : 1);
    if (best === 2) break;
  }
  return best;
}

// Can the party member whose sight is `s` see this board point?
function visibleFrom(s, x, y) {
  if (!pointInPolygon(x, y, s.poly)) return false;
  const d = Math.hypot(x - s.cx, y - s.cy);
  if (s.feel) return d <= s.feel;                      // blinded or unconscious: only their own square
  if (ambientNow() !== 'dark') return true;
  return d <= s.dv || lightLevelAt(x, y) > 0;
}

const litMask = document.createElement('canvas');
const lmctx = litMask.getContext('2d');
const sightTmp = document.createElement('canvas');
const stctx = sightTmp.getContext('2d');
const maskTmp = document.createElement('canvas');
const mtctx = maskTmp.getContext('2d');

// The lighting canvases are drawn at reduced size on big maps (the edges are soft anyway); drawing code keeps using board pixels.
let lightScale = 1;
function sizeLightCanvases(W, H) {
  lightScale = Math.min(1, 1400 / Math.max(W, H));
  const w = Math.ceil(W * lightScale), h = Math.ceil(H * lightScale);
  for (const c of [litMask, sightTmp, maskTmp]) { c.width = w; c.height = h; }
}
const scaled = (ctx) => ctx.setTransform(lightScale, 0, 0, lightScale, 0, 0);
const plainTransform = (ctx) => ctx.setTransform(1, 0, 0, 1, 0, 0);

// Where the light sources reach (in the dark): each light fills its sight polygon out to its dim radius, bright in the middle.
function buildLitMask() {
  scaled(lmctx);
  lmctx.globalCompositeOperation = 'lighter';
  for (const L of allLights()) {
    const poly = lightPoly(L);
    if (poly.length < 3) continue;
    lmctx.save();
    lmctx.beginPath();
    lmctx.moveTo(poly[0].x, poly[0].y);
    for (let i = 1; i < poly.length; i++) lmctx.lineTo(poly[i].x, poly[i].y);
    lmctx.closePath();
    lmctx.clip();
    const g = lmctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.dim);
    const mid = Math.min(0.98, L.bright / L.dim);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(mid, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    lmctx.fillStyle = g;
    lmctx.fillRect(L.x - L.dim, L.y - L.dim, L.dim * 2, L.dim * 2);
    lmctx.restore();
  }
  lmctx.globalCompositeOperation = 'source-over';
}

// What one party member sees right now, drawn as an opaque shape onto sightTmp: their line-of-sight polygon, cut down to what is lit
// or within their darkvision when it is dark (and to their own square when they are blind).
function drawSightShape(s, shape) {
  const poly = shape || s.poly;                       // the party member's sight polygon, or another shape to cut down the same way
  for (const c of [stctx, mtctx]) { plainTransform(c); c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, sightTmp.width, sightTmp.height); scaled(c); }
  stctx.fillStyle = '#fff';
  stctx.beginPath();
  stctx.moveTo(poly[0].x, poly[0].y);
  for (let i = 1; i < poly.length; i++) stctx.lineTo(poly[i].x, poly[i].y);
  stctx.closePath();
  stctx.fill();
  const dark = ambientNow() === 'dark';
  if (!s.feel && !dark) return;
  if (!s.feel) { plainTransform(mtctx); mtctx.drawImage(litMask, 0, 0); scaled(mtctx); }
  const reach = s.feel || s.dv;
  if (reach > 0) {
    const g = mtctx.createRadialGradient(s.cx, s.cy, reach * 0.7, s.cx, s.cy, reach);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    mtctx.fillStyle = g;
    mtctx.fillRect(s.cx - reach, s.cy - reach, reach * 2, reach * 2);
  }
  plainTransform(stctx);
  stctx.globalCompositeOperation = 'destination-in';
  stctx.drawImage(maskTmp, 0, 0);
  stctx.globalCompositeOperation = 'source-over';
}

async function loadMapLighting() {
  state.ambience = '';
  state.ambient = 'bright';
  state.lights = [];
  if (!state.map.url || !state.map.img) return;
  try {
    const res = await fetch('/api/map-config?map=' + encodeURIComponent(state.map.url.split('/').pop()));
    const { config } = await res.json();
    if (!config) return;
    state.ambient = ['bright', 'dim', 'dark'].includes(config.light) ? config.light : 'bright';
    state.ambience = typeof config.ambience === 'string' ? config.ambience : '';
    const f = state.map.drawW / state.map.img.naturalWidth;
    const px = state.map.drawW / (config.squares || 50);          // board pixels per printed square
    state.lights = (Array.isArray(config.lights) ? config.lights : []).map((l, i) => ({
      id: l.name || `light-${i}`, name: l.name || `light ${i + 1}`, x: l.x * f, y: l.y * f, dim: l.range * px, bright: (l.range * px) / 2, flicker: l.flicker === true
    }));
  } catch { /* no config: bright, no lights */ }
}

const lightingForAi = () => ({

  mapLights: state.lights.slice(0, 40).map((l) => ({ id: l.id, name: l.name, col: Math.floor(l.x / GRID), row: Math.floor(l.y / GRID), brightFt: Math.round(l.bright / GRID * FT_PER_SQUARE), dimFt: Math.round(l.dim / GRID * FT_PER_SQUARE), on: !(state.lightsOff[state.map.url || ''] || []).includes(l.id) }))
});
